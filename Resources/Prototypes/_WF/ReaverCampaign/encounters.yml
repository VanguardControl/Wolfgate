# The Ashfall Reaver campaign's encounters. Everything here is started by the campaign or an admin, never the
# storyteller. The first ship listed is the lead: a stronghold breaks when its lead is out of the fight, and a patrol
# or raid flies the lead's orders.

# A light stronghold: a raider holding a cell centre with one guard circling it. Founded first and at low tiers.
- type: wfEncounter
  id: WFReaverStrongholdLight
  name: wf-reaver-name-stronghold
  start: Manual
  lifetime: Persistent
  category: Threat
  icon: Flag
  leash: 2000
  manifests: [ WFManifestContraband ]
  ships:
  - key: lead
    navigation: WFCrewNavigationRaider
    side: reavers
    faction: PirateNF
    distress: false
    company: WFAshfallReavers
    profile: WFCrewProfilePirate
    vessels: [ Kalisto, Metis ]
    deckhands: 3
    guards: 2
    cargo: 4
    skill: Regular
    warnRange: 1500
    attackRange: 900
    zoneLines: wf-encounter-pirate-zone
    disengage: Deter
    disengageRange: 1200
    objectives:
    - kind: Hold
  - key: guard1
    navigation: WFCrewNavigationRaider
    side: reavers
    faction: PirateNF
    distress: false
    company: WFAshfallReavers
    profile: WFCrewProfilePirate
    vessels: [ Kalisto, Metis ]
    deckhands: 0
    captain: false
    roles: [ WFCrewPilot, WFCrewGunner ]
    offset: 350, 0
    skill: Regular
    objectives:
    - kind: Circle
      target: lead
      range: 700

