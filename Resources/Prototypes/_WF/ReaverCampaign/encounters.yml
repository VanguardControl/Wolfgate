  name: wf-reaver-name-patrol
  start: Manual
  lifetime: Transient
  category: Threat
  icon: Skull
  duration: 3600
  ships:
  - key: lead
    navigation: WFCrewNavigationRaider
    side: reavers
    faction: PirateNF
    distress: false
    company: WFAshfallReavers
    profile: WFCrewProfilePirate
    vessels: [ Kalisto, Metis, Bastion, Garm ]
    deckhands: 2
    engineer: false
    skill: Regular
    warnRange: 900
    attackRange: 450
    zoneLines: wf-encounter-pirate-zone
    disengage: Deter
    disengageRange: 1200
  - key: wing
    navigation: WFCrewNavigationRaider
    side: reavers
    faction: PirateNF
    distress: false
    company: WFAshfallReavers
    profile: WFCrewProfilePirate
    vessels: [ Carrion, Hazel, Horsefly, Tick ]
    deckhands: 0
    captain: false
    roles: [ WFCrewPilot, WFCrewGunner ]
    offset: 160, 0
    skill: Regular
    warnRange: 900
    attackRange: 450
    zoneLines: wf-encounter-pirate-zone
    disengage: Deter
    disengageRange: 1200
    objectives:
    - kind: Escort
      target: lead

