# Stand-in cavern under every world until each gets its own geology: limestone tunnels and dirt chambers through
# plain rock.
# Layers run last to first and the first match wins.

- type: biomeTemplate
  id: WFCavernBiomePlaceholder
  layers:
  # Substrate and tunnel floor.
  - !type:BiomeTileLayer
    tile: WFCavernFloorLimestone
    threshold: -1
  # Rock wherever ridged noise is at most 0.5; the tunnels are the ridges.
  - !type:BiomeMetaLayer
    template: WFCavernRockPlaceholder
    invert: true
    threshold: -0.5
    noise:
      seed: 7
      noiseType: OpenSimplex2
      fractalType: Ridged
      octaves: 1
      frequency: 0.035
  # Chambers on the web: a dirt floor, so the limestone-only rock layer leaves them open. Mouth pads need them:
  # the tunnels alone are too narrow for the openness check anywhere but at junctions.
  - !type:BiomeMetaLayer
    template: WFCavernChamberPlaceholder
    threshold: 0.35
    noise:
      seed: 101
      noiseType: OpenSimplex2
      fractalType: FBm
      octaves: 2
      frequency: 0.025

- type: biomeTemplate
  id: WFCavernRockPlaceholder
  layers:
  - !type:BiomeEntityLayer
    threshold: -1
    allowedTiles:
    - WFCavernFloorLimestone
    entities:
    - WallRock

- type: biomeTemplate
  id: WFCavernChamberPlaceholder
  layers:
  - !type:BiomeTileLayer
    tile: FloorPlanetDirt
    threshold: -1
