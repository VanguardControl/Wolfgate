# Cavern floors inherit their parent's look and name. Each is indestructible and can't be dug, so the bottom layer
# never opens to void.

- type: tile
  id: WFCavernFloorLimestone
  parent: FloorCave
  indestructible: true
  deconstructTools: []

# Landing tiles: what lies under each mouth. The fall multipliers soften or harden the one-level drop.

- type: tile
  id: WFCavernFloorAsh
  parent: FloorCaveDrought
  indestructible: true
  deconstructTools: []
  fallDamageMultiplier: 0.75
  fallStunMultiplier: 0.75

- type: tile
  id: WFCavernFloorSandDrift
  parent: FloorAsteroidSand
  indestructible: true
  deconstructTools: []
  fallDamageMultiplier: 0.5
  fallStunMultiplier: 0.5

- type: tile
  id: WFCavernFloorChromiteScree
  parent: FloorChromite
  indestructible: true
  deconstructTools: []
  fallDamageMultiplier: 1.5
  fallStunMultiplier: 1.2

# FloorSnow is already indestructible.
- type: tile
  id: WFCavernFloorSnowdrift
  parent: FloorSnow
  deconstructTools: []
  fallDamageMultiplier: 0.25
  fallStunMultiplier: 0.25

- type: tile
  id: WFCavernFloorGut
  parent: FloorAsteroidIronsand
  indestructible: true
  deconstructTools: []
  fallDamageMultiplier: 0.4
  fallStunMultiplier: 0.4
