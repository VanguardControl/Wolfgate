# One cavern under each world, built at depth -1 with its planet network while wf.caverns is on.
# Mouths: avoid also lists each world's rock-outcrop spawner, so no mouth is walled in by an outcrop.

- type: wfCavern
  id: WFCavernAsclepiu
  surface: WFSurfaceAsclepiu
  name: wf-cavern-asclepiu-name
  level: WFCavernAsclepiuLevel
  seedOffset: 7901
  roofColor: "#070a08"
  shaftLight: 0.5
  mouths:
    holeSize: 2
    cellSize: 96
    groundTiles: [FloorPlanetGrass, FloorPlanetDirt, FloorSnow]
    avoid: [MonoFloorWaterEntity, MonoPlanetmapOreBase, MonoPlanetmapOreSnow]
    landingTile: FloorWater
    shade: WFCavernShadeAsclepiu
    climbPoint: WFCavernClimbAsclepiu

