# The pit over each hole tile of a mouth, and the climb point in the cavern under its lip.

# Unanchored with no physics, so it never falls into the hole it marks.
- type: entity
  id: WFCavernShadeBase
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: false
  - type: Clickable
  - type: Sprite
    drawdepth: LowFloors
    sprite: Tiles/Planet/Chasms/desert_chasm.rsi
    state: full
  - type: WFCavernShaft

- type: entity
  id: WFCavernShadeAsclepiu
  parent: WFCavernShadeBase
  components:
  - type: Sprite
    sprite: Tiles/Planet/Chasms/desert_chasm.rsi
    color: "#5d5445"

- type: entity
  id: WFCavernShadeFervidus
  parent: WFCavernShadeBase
  components:
  - type: Sprite
    sprite: Tiles/Planet/Chasms/basalt_chasm.rsi

- type: entity
  id: WFCavernShadeMerak
  parent: WFCavernShadeBase
  components:
  - type: Sprite
    sprite: Tiles/Planet/Chasms/desert_chasm.rsi

- type: entity
  id: WFCavernShadeAerumna
  parent: WFCavernShadeBase
  components:
  - type: Sprite
    sprite: Tiles/Planet/Chasms/chromite_chasm.rsi

- type: entity
  id: WFCavernShadeThrascias
  parent: WFCavernShadeBase
  components:
  - type: Sprite
    sprite: Tiles/Planet/Chasms/snow_chasm.rsi

- type: entity
  id: WFCavernShadeCarcinoma
  parent: WFCavernShadeBase
  components:
  - type: Sprite
    sprite: Tiles/Planet/Chasms/basalt_chasm.rsi
    color: "#4a0f16"

# Ladder art only: no fixtures and no CEZLevelHighGround, so it is climbed by verb, never walked up.
- type: entity
  id: WFCavernClimbBase
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: Objects
    sprite: _CE/Structures/Architecture/Ladders/stone.rsi
    state: straight
  - type: WFCavernClimb

- type: entity
  id: WFCavernClimbAsclepiu
  parent: WFCavernClimbBase
  components:
  - type: Sprite
    sprite: _CE/Structures/Architecture/Ladders/dirt_cliff.rsi

