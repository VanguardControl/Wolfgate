# Outpost modules: buildings bought outright at the outpost console's Hideout tab. A purchase leaves a survey stake at
# the console that lays the module's prefab, in any of its layouts and themes. Any module may be bought again, except a
# hangar that already stands. Machines beyond what a prefab holds come from the outfitter and the Trade tab.

- type: wfHideoutRules
  id: WFHideoutRules
  # A home's upkeep in place of the outpost load markup, and the fee for moving its home world.
  homeMarkup: 0.1
  moveFee: 250000
  # Founding from the registry at Central costs credits only; riding its drop down to your outpost costs a fee.
  foundPrice: 15000
  rideFee: 2500
  # What a hideout may hold past a plain outpost's caps (1,600 tiles, 2,000 objects, 64 across, 6 cryopods). Floor and
  # decals are nearly free to the server; objects are what a save, a load and the world pay for, so with 160 outposts
  # standing the object cap is the number to keep down.
  tiles: 2400
  entities: 500
  span: 64
  pods: 4
  companyTiles: 1600
  companyEntities: 1000
  companyPods: 6
  insurancePremium: 0.2
  insuranceDeductible: 0.15
  # Safes take these (safes.yml): a lockbox 2, a safe 5, a vault safe 10. Only what a safe within them holds is saved.
  stashPoints: 10

