# Wolfmed wound surgeries. Six wound surgeries plus seven organ heals, expressed on Shitmed's step system
# (D7, P4-3). Every listing condition sits on the surgery, never on a step: SurgerySystem.RefreshUI raises
# SurgeryValidEvent on the surgery singleton only, so a condition on a step would bite at completion instead.

- type: entity
  parent: SurgeryBase
  id: SurgeryStopBleeding
  name: Stop Bleeding
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    steps:
    - SurgeryStepSutureBleeding
  - type: WolfmedSurgeryWoundCondition
    state: Open
    bleeding: true

- type: entity
  parent: SurgeryBase
  id: SurgeryStopInternalBleeding
  name: Stop Internal Bleeding
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepStopInternalBleeding
    - SurgeryStepSealTendWound
  - type: WolfmedSurgeryWoundCondition
    internalBleeding: true

- type: entity
  parent: SurgeryBase
  id: SurgeryMendFracture
  name: Mend Fracture
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepSetBone
    - SurgeryStepMendFracture
    - SurgeryStepSealTendWound
  - type: WolfmedSurgeryFractureCondition
    minGrade: Hairline

- type: entity
  parent: SurgeryBase
  id: SurgeryHealAmputationConsequence
  name: Repair Amputation Damage
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepHealAmputationConsequence
    - SurgeryStepSealTendWound
  - type: WolfmedSurgeryWoundCondition
    woundPrototype: AmputationConsequenceWound

- type: entity
  parent: SurgeryBase
  id: SurgeryTendWoundsBruteDeep
  name: Tend Deep Bruise Wounds
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepRepairBruteTissue
    - SurgeryStepSealTendWound
  - type: SurgeryWoundedCondition
    woundGroup: Brute
    minWoundSeverity: 100

- type: entity
  parent: SurgeryBase
  id: SurgeryTendWoundsBurnDeep
  name: Tend Deep Burn Wounds
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepRepairBurnTissue
    - SurgeryStepSealTendWound
  - type: SurgeryWoundedCondition
    woundGroup: Burn
    minWoundSeverity: 100

# Organ healing ---------------------------------------------------------------
# Seven slots, one per human-lineage organ (Resources/Prototypes/Body/Prototypes/human.yml). The torso five
# inherit SurgeryOpenRibcage's saw; the two head organs prefix SurgeryStepSawBones themselves, matching
# SurgeryRemove/InsertBrain and ...Eyes, which SurgeryOpenIncision does not saw for.

- type: entity
  parent: SurgeryBase
  id: SurgeryHealHeart
  name: Heal Heart
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenRibcage
    steps:
    - SurgeryStepHealHeart
    - SurgeryStepSealOrganWound
  - type: SurgeryPartCondition
    part: Torso
  - type: WolfmedSurgeryOrganDamagedCondition
    slot: heart

