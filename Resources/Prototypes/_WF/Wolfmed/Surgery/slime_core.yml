# The slime's brain is its core, and the core sits in the torso's core slot, not in a head's brain slot. The two
# brain surgeries list on a head with a brain in it, so a slime with a damaged brain had nothing listed on any part
# and no way back. The same two on the torso: open the chest like any other chest organ, work on the core, close.

- type: entity
  parent: SurgeryBase
  id: WFSurgeryHealSlimeCore
  name: Heal Slime Core
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenRibcage
    steps:
    - WFSurgeryStepHealSlimeCore
    - SurgeryStepSealOrganWound
  - type: SurgeryPartCondition
    part: Torso
  - type: WolfmedSurgeryOrganDamagedCondition
    slot: core

- type: entity
  parent: SurgeryBase
  id: WFSurgeryRepairSlimeCore
  name: Repair Slime Core
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenRibcage
    steps:
    - WFSurgeryStepRepairSlimeCore
    - SurgeryStepSealOrganWound
  - type: SurgeryPartCondition
    part: Torso
  - type: WolfmedSurgeryOrganDamagedCondition
    slot: core
    # As WFSurgeryRepairBrain: any damaged core, a destroyed one included.
    anyDamage: true

- type: entity
  parent: WFSurgeryStepHealOrganBase
  id: WFSurgeryStepHealSlimeCore
  name: Heal the core
  categories: [ HideSpawnMenu ]
  components:
  - type: WolfmedSurgeryOrganHealEffect
    slot: core
    amount: 3 # as WFSurgeryStepHealBrain

- type: entity
  parent: WFSurgeryStepRepairBrain
  id: WFSurgeryStepRepairSlimeCore
  name: Repair the core
  categories: [ HideSpawnMenu ]
  components:
  - type: WolfmedSurgeryBrainRepairEffect
    slot: core
