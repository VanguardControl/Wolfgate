# Which wound a hit makes, by cause and size (W1). Rules are tried highest priority first; the first one
# whose filters and chance roll pass wins and, with replacesDefault, takes the place of the damage type's
# default Onyx wound. Every filter left out matches everything.
#
# Adding one: write the wound with `ruleOnly: true`, add it to the part profile's supportedWounds, then a
# rule here. No C#.

# Blunt trauma (W3) -----------------------------------------------------------
# Crush sits above the slash and bite rules because it replaces the plain bruise; everything under it runs
# on the same hit through `continue`, so one heavy swing can crush the limb and pop the joint at once.

# A crushing blow. Replaces the ordinary blunt wound: at this size the bruise IS the crush injury.
- type: wolfmedWoundRule
  id: WolfmedRuleCrushInjury
  priority: 95
  wound: WolfmedCrushInjuryWound
  damageTypes: [ Blunt ]
  minDamage: 30
  continue: true
  capabilities: [ Biological ]

# Crushed tissue bleeds where nobody can see it. The one chance roll in W3: a crush injury is a reliable
# consequence, internal bleeding is the luck of where the blow landed.
- type: wolfmedWoundRule
  id: WolfmedRuleCrushInternalBleed
  priority: 90
  wound: InternalBleedingWound
  damageTypes: [ Blunt ]
  minDamage: 30
  chance: 0.4
  severityMultiplier: 0.5
  minSeverity: 10
  partTypes: [ Head, Torso, Arm, Leg ]
  replacesDefault: false
  continue: true
  capabilities: [ Biological ]

# A knock to the head. Lower threshold than a crush: it takes far less to rattle a brain than to crush a
# limb, and the concussion is added to whatever the skull itself took.
- type: wolfmedWoundRule
  id: WolfmedRuleConcussion
  priority: 85
  wound: WolfmedConcussionWound
  damageTypes: [ Blunt ]
  minDamage: 15
  severityMultiplier: 0.6
  minSeverity: 6
  partTypes: [ Head ]
  replacesDefault: false
  continue: true
  capabilities: [ Biological ]

# A blow to the chest that reached something inside it.
- type: wolfmedWoundRule
  id: WolfmedRuleOrganContusion
  priority: 80
  wound: WolfmedOrganContusionWound
  damageTypes: [ Blunt ]
  minDamage: 20
  severityMultiplier: 0.5
  minSeverity: 5
  partTypes: [ Torso ]
  replacesDefault: false
  continue: true
  capabilities: [ Biological ]

# A joint wrenched out of its socket by a heavy swing.
- type: wolfmedWoundRule
  id: WolfmedRuleDislocation
  priority: 76
  wound: WolfmedDislocationWound
  damageTypes: [ Blunt ]
  minDamage: 18
  severityMultiplier: 0.4
  minSeverity: 5
  partTypes: [ Arm, Hand, Leg, Foot ]
  replacesDefault: false
  continue: true
  capabilities: [ Biological ]

# Or by the landing. A thrown body and a fall both arrive as blunt damage with no weapon behind it, so the
# threshold is lower: there is no armour-shaped way to take half a landing.
- type: wolfmedWoundRule
  id: WolfmedRuleDislocationThrown
  priority: 75
  wound: WolfmedDislocationWound
  damageTypes: [ Blunt ]
  causes: [ Thrown, Environmental ]
  minDamage: 10
  maxDamage: 18 # the rule above owns everything heavier, so one landing never rolls both
  severityMultiplier: 0.5
  minSeverity: 5
  partTypes: [ Arm, Hand, Leg, Foot ]
  replacesDefault: false
  continue: true
  capabilities: [ Biological ]

# Slash and bite (W2) ---------------------------------------------------------
# Deterministic bands, like the ballistic ones below: a medic can read what a hit meant off the analyzer,
# and the tests stay RNG-free. Rarity comes from the thresholds, not from a chance roll.

# A bite tears tissue out rather than cutting it. Replaces the plain cut or puncture.
- type: wolfmedWoundRule
  id: WolfmedRuleAvulsion
  priority: 80
  wound: WolfmedAvulsionWound
  damageTypes: [ Slash, Piercing ]
  causes: [ Bite ]
  minDamage: 6
  capabilities: [ Biological ]

# A cut deep enough to open an artery. Added to the cut rather than replacing it, and `continue` lets the
# tendon rule roll on the same swing: one bad hit can do both.
- type: wolfmedWoundRule
  id: WolfmedRuleArterialBleedSlash
  priority: 70
  wound: WolfmedArterialBleedWound
  damageTypes: [ Slash ]
  minDamage: 22
  severityMultiplier: 0.5
  minSeverity: 8
  replacesDefault: false
  continue: true
  capabilities: [ Biological ]

# A puncture has to be deeper again to reach one.
- type: wolfmedWoundRule
  id: WolfmedRuleArterialBleedPiercing
  priority: 69
  wound: WolfmedArterialBleedWound
  damageTypes: [ Piercing ]
  minDamage: 30
  severityMultiplier: 0.5
  minSeverity: 8
  replacesDefault: false
  continue: true
  capabilities: [ Biological ]

# A limb only. A tendon in the torso or the head is not a thing a medic can splint around.
- type: wolfmedWoundRule
  id: WolfmedRuleTendonCut
  priority: 60
  wound: WolfmedTendonCutWound
  damageTypes: [ Slash ]
  minDamage: 16
  severityMultiplier: 0.5
  minSeverity: 5
  partTypes: [ Arm, Hand, Leg, Foot ]
  replacesDefault: false
  capabilities: [ Biological ]

# Ballistic (W1) ---------------------------------------------------------------

# Explosions and buckshot leave fragments in the flesh. Explosion damage is split across parts, so the
# per-part share is small; the floor is deliberately low.
- type: wolfmedWoundRule
  id: WolfmedRuleShrapnel
  priority: 50
  wound: WolfmedShrapnelWound
  damageTypes: [ Piercing ]
  causes: [ Explosion, Fragment ]
  minDamage: 2
  capabilities: [ Biological ]
  embedded:
    item: WolfmedShrapnelFragment
    minCount: 1
    maxCount: 2
    maxTotal: 6

# A rifle-weight round stays in. Always, so a medic can rely on what a heavy hit means.
- type: wolfmedWoundRule
  id: WolfmedRuleLodgedRoundHeavy
  priority: 40
  wound: WolfmedLodgedRoundWound
  damageTypes: [ Piercing ]
  causes: [ Projectile ]
  minDamage: 18
  capabilities: [ Biological ]
  embedded:
    item: WolfmedSpentRound

# A lighter one sometimes does.
- type: wolfmedWoundRule
  id: WolfmedRuleLodgedRound
  priority: 30
  wound: WolfmedLodgedRoundWound
  damageTypes: [ Piercing ]
  causes: [ Projectile ]
  minDamage: 7
  maxDamage: 18
  chance: 0.2
  capabilities: [ Biological ]
  embedded:
    item: WolfmedSpentRound

# Otherwise it went through.
- type: wolfmedWoundRule
  id: WolfmedRuleGunshot
  priority: 20
  wound: WolfmedGunshotWound
  damageTypes: [ Piercing ]
  causes: [ Projectile ]
  minDamage: 7
  capabilities: [ Biological ]

# A round that barely caught the limb.
- type: wolfmedWoundRule
  id: WolfmedRuleGraze
  priority: 10
  wound: WolfmedGrazeWound
  damageTypes: [ Piercing ]
  causes: [ Projectile ]
  maxDamage: 7
  minSeverity: 3
  capabilities: [ Biological ]
