# LOOK: what each wound looks like to somebody standing in front of the patient. The health examine reads
# nothing else, so a wound with no entry here is invisible and WolfmedVisualInspectionTest fails.
#
# visibility: None    nothing to see; the analyzer still reports it. selfHint is what the patient notices.
#             Skin    on bare skin or bare plating; anything worn over the part hides it.
#             Clothed gross enough to show through clothing: deformity, a stump, sparks, a leak.
# distant:    carries across a room. Everything else needs the examiner within examine detail range.
#
# Stage keys are the wound prototype's own stage ids. A severity below the lowest stage falls back to the
# wound-level fields, which is why every wound that is invisible while slight declares `visibility: None`
# at the top and names only the stages that show.

- type: wolfmedLookProfile
  id: WolfmedLookDefault
  # Slot defaults for clothing with no armour `coverage:`. An armour that declares coverage uses its own.
  coverage:
  - slots: [ INNERCLOTHING ]
    parts: [ Torso, Arm, Leg ]
  - slots: [ OUTERCLOTHING ]
    parts: [ Torso, Arm ]
  - slots: [ GLOVES ]
    parts: [ Hand ]
  - slots: [ FEET ]
    parts: [ Foot ]
  - slots: [ HEAD ]
    parts: [ Head ]
  # Rates are severity * the stage's rate * wolfmed.bleed_rate, so a fresh minor cut runs at about 0.6, a
  # deep one at 2.7 and a cut artery at 9. The gore system calls 0.9 a major bleed; flowing sits just above.
  bleedOozing: 0.05
  bleedFlowing: 1.0
  bleedSpurting: 5.0
  soakThrough: 1.0
  distantBleed: 3.0
  sepsisVisibleAt: 40

