# A fracture is felt long before it is seen. Only a bone out of line or through the skin shows, and that
# shows through a jumpsuit; below that the patient gets an ache and nobody else gets anything.
- type: wolfmedWoundLook
  id: WolfmedLookBoneFracture
  wound: BoneFractureWound
  visibility: None
  selfHint: wolfmed-look-fracture-ache
  stages:
    Hairline: { selfHint: wolfmed-look-fracture-ache }
    Simple: { selfHint: wolfmed-look-fracture-ache-bad }
    Displaced: { description: wolfmed-look-fracture-displaced, visibility: Clothed, distant: true }
    Comminuted: { description: wolfmed-look-fracture-comminuted, visibility: Clothed, distant: true }

- type: wolfmedWoundLook
