# The order S.A.M. treats a patient in when it plans for itself, for the PLAN button, the FIX ME button and
# the autofix module. Walked top to bottom; each step queues every procedure the occupant's condition allows
# and the pod's disks unlock. Nothing here is a procedure an operator could not queue by hand.

- type: autodocTriage
  id: WolfmedAutodocTriage
  steps:
  # 1. A heart that is not beating comes before every surgery, and the module is the only thing that helps.
  - defibrillate: true
    condition: Arrest

  # 2. What is emptying the patient fastest.
  - surgeries:
    - SurgeryRepairArtery
    - SurgeryStopInternalBleeding

  # 3. Then the rest of the bleeding.
  - surgeries:
    - SurgeryStopBleeding

  # 4. An open abdomen: not fatal this second, but everything after it is worse with the organs out.
  - surgeries:
    - SurgeryCloseEvisceration

  # 5. Organ repair in place. Removal and insertion need a hand at the tray, so the planner skips them.
  - surgeries:
    - SurgeryHealHeart
    - SurgeryHealLungs
    - SurgeryHealLiver
    - SurgeryHealStomach
    - SurgeryHealKidneys
    - SurgeryRepairBrain
    - SurgeryHealBrain
    - SurgeryHealEyes

  # 6. Bones.
  - surgeries:
    - SurgeryMendFracture
    - SurgeryHealAmputationConsequence

  # 7. Deep tissue before shallow: the deep surgeries are the ones gauze cannot reach.
  - surgeries:
    - SurgeryTendWoundsBruteDeep
    - SurgeryTendWoundsBurnDeep

  # 8. Everything else on the surface.
  - surgeries:
    - SurgeryTendWoundsBrute
    - SurgeryTendWoundsBurn
    - SurgeryGraftSkin
    - SurgeryRepairTendon

  # 9. Synthetic bodies.
  - categories:
    - WolfmedAutodocCategoryMechanical

  # 10. Putting parts and organs back. The planner skips every one of these unless the delivery tray
  # already holds something that fits, so it never queues a procedure it cannot finish alone.
  - surgeries:
    - SurgeryAttachHead
    - SurgeryAttachLeftArm
    - SurgeryAttachRightArm
    - SurgeryAttachLeftLeg
    - SurgeryAttachRightLeg
    - SurgeryAttachLeftHand
    - SurgeryAttachRightHand
    - SurgeryAttachLeftFoot
    - SurgeryAttachRightFoot
    - SurgeryAttachHands
    - SurgeryInsertHeart
    - SurgeryInsertLungs
    - SurgeryInsertLiver
    - SurgeryInsertStomach
    - SurgeryInsertBrain
    - SurgeryInsertEyes
    - SurgeryInsertPump

  # 11. Whatever somebody else left open. Every procedure above closes after itself, so this only ever
  # catches a patient who was already lying open when they went in; requiresStarted is what says so.
  - requiresStarted: true
    surgeries:
    - SurgeryCloseIncision
