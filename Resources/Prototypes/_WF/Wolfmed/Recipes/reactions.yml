# Spaceacillin (W5). Two medical reagents chemistry already stocks, so an infected crew is a problem
# medbay can solve from its own dispenser.

- type: reaction
  id: Spaceacillin
  reactants:
    Cryptobiolin:
      amount: 1
    Inaprovaline:
      amount: 1
  products:
    Spaceacillin: 2

# Wolfmed's painkiller ladder (CONSC). Each one is two things chemistry already stocks, so the ladder is
# reachable from the dispenser on a shift with no cargo.

- type: reaction
  id: WolfmedAnalgesic
  reactants:
    Ibuprofen:
      amount: 1
    Sugar:
      amount: 1
  products:
    WolfmedAnalgesic: 2

- type: reaction
  id: WolfmedOpiate
  reactants:
    Tramadol:
      amount: 1
    Ethanol:
      amount: 1
  products:
    WolfmedOpiate: 2

- type: reaction
  id: WolfmedStim
  reactants:
    Ephedrine:
      amount: 1
    Epinephrine:
      amount: 1
  products:
    WolfmedStim: 2

# M2 (OD14): naloxone, the overdose's definitive fix, from two things chemistry makes from its own dispenser.
- type: reaction
  id: WolfmedNaloxone
  reactants:
    Inaprovaline:
      amount: 1
    Ammonia:
      amount: 1
  products:
    WolfmedNaloxone: 2
