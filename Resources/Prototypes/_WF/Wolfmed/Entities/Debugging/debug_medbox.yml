# Everything Wolfmed treatment uses, in one crate. Spawn-menu only; never mapped or sold.

- type: entity
  parent: CrateMedical
  id: CrateWolfmedDebug
  name: wolfmed debug crate
  suffix: DEBUG
  description: Every item, tool and drug that treats a wound. For testing.
  components:
  - type: EntityStorage
    capacity: 100
  - type: StorageFill
    contents:
    # Diagnostics
    - id: HandheldHealthAnalyzer
    - id: Defibrillator
    # Topicals and dressings
    - id: Brutepack
    - id: Ointment
    - id: Gauze
    - id: MedicatedSuture
    - id: RegenerativeMesh
    - id: Bloodpack
    - id: Tourniquet
      amount: 3
    - id: MedicalPatchMakeshift
      amount: 3
    - id: WolfmedSplint
      amount: 3
    - id: WolfmedSplintImprovised
      amount: 2
    - id: WolfmedSkinGraft
      amount: 3
    # Surgery
    - id: Scalpel
    - id: Hemostat
    - id: Retractor
    - id: Cautery
    - id: Saw
    - id: Drill
    - id: Bonesetter
    - id: BoneGel
    # Dirty embedded-object removal
    - id: CombatKnife
    # Chassis repair
    - id: WelderExperimental
    - id: CableApcStack
    - id: Wrench
    - id: NaniteApplicator
    # Washing and cleaning
    - id: WolfmedAntisepticSpray
      amount: 2
    - id: SprayBottleWater
    - id: SprayBottleSpaceCleaner
    - id: Soap
    # Drugs
    - id: Syringe
      amount: 4
    - id: SpaceacillinChemistryBottle
      amount: 2
    - id: EthanolChemistryBottle
    - id: WolfmedDebugBottleOsteogen
    - id: WolfmedDebugBottleIbuprofen
    - id: WolfmedDebugBottleTramadol
    - id: WolfmedDebugBottleKetorolac
    - id: WolfmedDebugBottleOxycodone

- type: entity
  parent: BaseChemistryBottleFilled
  id: WolfmedDebugBottleOsteogen
  suffix: DEBUG, osteogen
  categories: [ HideSpawnMenu ]
  components:
  - type: Label
    currentLabel: reagent-name-osteogen
  - type: SolutionContainerManager
    solutions:
      drink: # name and volume are hard-coded in ChemMasterComponent
        maxVol: 30
        reagents:
        - ReagentId: Osteogen
          Quantity: 30

