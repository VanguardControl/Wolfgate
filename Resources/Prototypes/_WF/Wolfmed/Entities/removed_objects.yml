# What comes out of a wound (W1). Both reuse sprites already in the repo, so no new art or attribution.

- type: entity
  parent: BaseItem
  id: WolfmedSpentRound
  name: spent round
  description: A deformed bullet, dug out of someone. Still warm.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    state: base-spent
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage
  - type: StaticPrice
    price: 0

- type: entity
  parent: BaseItem
  id: WolfmedShrapnelFragment
  name: shrapnel
  description: A jagged sliver of metal. It was somewhere it should not have been.
  components:
  - type: Sprite
    sprite: Objects/Materials/Shards/shrapnel.rsi
    state: shrapnelsmall
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage
  - type: StaticPrice
    price: 0
