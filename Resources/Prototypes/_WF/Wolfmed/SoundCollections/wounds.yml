# Wolfmed wound, dismemberment and interaction audio (V124). Every file here already ships with the
# repo; the collections exist so the whole feedback layer can be re-pointed at other audio by editing
# this one file, without touching a system or a wound prototype.

# --- Wounds by cause (V1) ---------------------------------------------------------------------------

# Something tears flesh: slashes, bites, avulsions.
- type: soundCollection
  id: WolfmedWoundFlesh
  files:
  - /Audio/Weapons/bladeslice.ogg
  - /Audio/Weapons/Xeno/alien_claw_flesh1.ogg
  - /Audio/Weapons/Xeno/alien_claw_flesh2.ogg
  - /Audio/Weapons/Xeno/alien_claw_flesh3.ogg

# Something punches through it: gunshots, shrapnel, stabs.
- type: soundCollection
  id: WolfmedWoundPierce
  files:
  - /Audio/Weapons/Guns/Hits/bullet_meat1.ogg
  - /Audio/Weapons/Guns/Hits/bullet_meat2.ogg
  - /Audio/Weapons/Guns/Hits/bullet_meat3.ogg
  - /Audio/Weapons/Guns/Hits/bullet_meat4.ogg

# A heavy dull hit: bruises, crush injuries, contusions.
- type: soundCollection
  id: WolfmedWoundBlunt
  files:
  - /Audio/Effects/hit_kick.ogg
  - /Audio/Weapons/genhit1.ogg
  - /Audio/Weapons/genhit2.ogg
  - /Audio/Weapons/genhit3.ogg

# A bone going. Fractures and dislocations.
- type: soundCollection
  id: WolfmedWoundBone
  files:
  - /Audio/Effects/snap.ogg
  - /Audio/Effects/chopstickbreak.ogg
  - /Audio/Weapons/Guns/Hits/snap.ogg

# Heat on skin: burns, charring, cauterisation, chemical burns.
- type: soundCollection
  id: WolfmedWoundBurn
  files:
  - /Audio/Effects/sizzle.ogg
  - /Audio/Effects/lightburn.ogg

# Current going somewhere it should not.
- type: soundCollection
  id: WolfmedWoundShock
  files:
  - /Audio/Effects/sparks1.ogg
  - /Audio/Effects/sparks2.ogg
  - /Audio/Effects/sparks3.ogg
  - /Audio/Effects/sparks4.ogg

# A chassis taking a hit. Dents, breaches, servo damage.
- type: soundCollection
  id: WolfmedWoundChassis
  files:
  - /Audio/_WF/Weapons/Impacts/impact_metal_03.ogg
  - /Audio/_WF/Weapons/Impacts/impact_metal_07.ogg
  - /Audio/_WF/Weapons/Impacts/impact_metal_11.ogg
  - /Audio/_WF/Weapons/Impacts/impact_metal_15.ogg

