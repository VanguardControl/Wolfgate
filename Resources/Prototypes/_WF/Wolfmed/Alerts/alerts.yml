# Sepsis (W5). Shown while WolfmedSepsisComponent is on the body, cleared when it leaves.

- type: alert
  id: WolfmedSepsis
  icons:
  - sprite: /Textures/_WF/Wolfmed/Interface/Alerts/sepsis.rsi
    state: sepsis
  name: alerts-wolfmed-sepsis-name
  description: alerts-wolfmed-sepsis-desc

# Downed (CONSC). The Downed alert when the cause names none of its own. M1a moved it into the Health
# category: on a wound host the condition alerts replace the stock health alerts (plan §5.2).

- type: alert
  id: WolfmedDowned
  category: Health
  clickEvent: !type:WolfmedConditionAlertEvent
  icons:
  - sprite: /Textures/_WF/Wolfmed/Interface/Alerts/downed.rsi
    state: downed
  name: alerts-wolfmed-downed-name
  description: alerts-wolfmed-downed-desc

# M1a: one alert per cause and state (plan §5.2), all in the Health category so each replaces the last.
# Clicking one tells the patient everything holding them down. The icons are reused placeholders (art debt):
# downed for every Downed alert, the stock critical, bleed and breathing icons for the rest.

