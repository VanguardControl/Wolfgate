# Wolfmed's own painkiller ladder (CONSC). The shipped chems all treat something as well; these three do
# nothing but hold a wounded body up, which is what makes the tiers readable at a glance.

- type: reagent
  id: WolfmedAnalgesic
  name: reagent-name-wolfmed-analgesic
  group: Medicine
  desc: reagent-desc-wolfmed-analgesic
  physicalDesc: reagent-physical-desc-powdery
  flavor: bitter
  color: "#e8d9a6"
  metabolisms:
    Medicine:
      metabolismRate: 0.15
      effects:
      # Weak: takes the edge off enough to get back on your feet, never enough to keep you awake.
      - !type:WolfmedPainRelief
        tier: Weak
        strength: 22
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          reagent: WolfmedAnalgesic
          min: 20
        damage:
          types:
            Poison: 0.6

- type: reagent
  id: WolfmedOpiate
  name: reagent-name-wolfmed-opiate
  group: Medicine
  desc: reagent-desc-wolfmed-opiate
  physicalDesc: reagent-physical-desc-thick
  flavor: medicine
  color: "#7a6fd6"
  metabolisms:
    Medicine:
      metabolismRate: 0.1
      effects:
      # Strong: enough to walk a patient off the field, at the price of the sedation meter.
      - !type:WolfmedPainRelief
        tier: Strong
        strength: 70
        sedation: 0.018
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          reagent: WolfmedOpiate
          min: 15
        damage:
          types:
            Poison: 0.8

- type: reagent
  id: WolfmedStim
  name: reagent-name-wolfmed-stim
  group: Medicine
  desc: reagent-desc-wolfmed-stim
  physicalDesc: reagent-physical-desc-shiny
  flavor: bitter
  color: "#ff5c3b"
  metabolisms:
    Medicine:
      metabolismRate: 0.4
      effects:
      # Emergency: 30 seconds on your feet whatever the pain says, then the bill.
      - !type:WolfmedPainRelief
        tier: Emergency
        strength: 0
        duration: 30
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          reagent: WolfmedStim
          min: 10
        damage:
          types:
            Poison: 1.5
