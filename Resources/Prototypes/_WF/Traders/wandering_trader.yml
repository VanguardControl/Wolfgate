- type: entity
  id: WFTraderSurplus
  parent: WFTraderWanderer
  name: surplus dealer
  description: Sells what armies no longer want, to anyone who does.
  suffix: Trader, Military Surplus
  components:
  - type: Trader
    dialogue: WFTraderSurplusDialogue
    killable: true
  - type: TraderShop
    vendors:
    - WFTraderStockSurplus
    - VendingMachineAmmoPOI
    priceMultiplier: 0.8
    randomStock: 12
    stockMin: 1
    stockMax: 3
    lootItems: 5

- type: entity
  id: WFTraderCurios
  parent: WFTraderWanderer
  name: curio dealer
  description: Antiques, heirlooms and oddities, each with a story attached.
  suffix: Trader, Curios
  components:
  - type: Trader
    dialogue: WFTraderCuriosDialogue
    killable: true
  - type: TraderShop
    vendors:
    - WFTraderStockCurios
    priceMultiplier: 1
    randomStock: 10
    stockMin: 1
    stockMax: 1

- type: entity
  id: WFTraderMedic
  parent: WFTraderWanderer
  name: medical supplier
  description: Clinic overstock, sold out of a hold.
  suffix: Trader, Medical
