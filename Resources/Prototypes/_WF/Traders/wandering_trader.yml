  parent: VendingMachineAmmo
  categories: [ HideSpawnMenu ]
  components:
  - type: VendingMachine
    pack: WFTraderCuriosInventory
    requiresCash: true

- type: traderDialogue
  id: WFTraderSurplusDialogue
  greeting: trader-surplus-greeting
  farewell: trader-surplus-farewell
