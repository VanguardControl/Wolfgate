# The wandering trader: a spacer selling a small, random, discounted stock out of a hold. Unlike the
# station traders this one can be hurt and killed, and when the stock is gone it is gone.
- type: startingGear
  id: WFTraderWandererGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorBrown
    outerClothing: ClothingOuterCoatJensen
    shoes: ClothingShoesBootsJack
    gloves: ClothingHandsGlovesFingerless

- type: traderDialogue
  id: WFTraderWandererDialogue
  greeting: trader-wanderer-greeting
  farewell: trader-wanderer-farewell
  options:
  - prompt: trader-wanderer-prompt-shop
    response: trader-wanderer-response-shop
    action: OpenShop
  - prompt: trader-wanderer-prompt-who
    response: trader-wanderer-response-who
    action: None

- type: entity
  id: WFTraderWanderer
  parent: WFBaseTrader
  name: wandering trader
  description: Sells tools, air and spare gear out of the hold, cheap, until it runs out.
  suffix: Trader, Wandering
  components:
  - type: RandomHumanoidAppearance
  - type: Loadout
    prototypes: [ WFTraderWandererGear ]
  - type: Trader
    dialogue: WFTraderWandererDialogue
    killable: true
  - type: TraderShop
    vendors:
    - WFTraderStockGeneral
    priceMultiplier: 0.6
    randomStock: 10
    stockMin: 1
    stockMax: 3
    lootItems: 4

# Every trader sells out of its own stock list, mirrored the way a vending machine is, and never out of a station
# machine: those hold junk, and some of them give it away. The stock entities exist only to carry the lists and are
# never placed. Each states its own MarketModifier and charges cash, so a line costs its appraised value times the
# modifier, times the trader's priceMultiplier. Lists leave out faction, event and uplink gear and anything that
# resells above what it costs here; the pack counts cap how many of a line a trader may roll.
- type: vendingMachineInventory
  id: WFTraderGeneralInventory
  startingInventory:
    Multitool: 3
    WelderIndustrial: 2
    PowerDrill: 1
