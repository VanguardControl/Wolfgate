# Crew roles: the mob, the duty worked, how readily it fights and any components the role adds. The radio operator
# stands guard at his post; his radio duty is a component, so he reports while his HTN sleeps. The captain works
# Guard until his own duty exists; the planner already hands him out so rosters don't change when it lands.

- type: wfCrewRole
  id: WFCrewCaptain
  mob: WFMobCrewOfficer
  duty: Guard
  engagement: WhenAttacked
  title: wf-crew-role-captain
  order: 0

- type: wfCrewRole
  id: WFCrewPilot
  mob: WFMobCrewOfficer
  duty: Pilot
  engagement: WhenAttacked
  title: wf-crew-role-pilot
  order: 10

- type: wfCrewRole
  id: WFCrewRadioOperator
  mob: WFMobCrewOfficer
  duty: Guard
  engagement: WhenAttacked
  title: wf-crew-role-radio-operator
  order: 20
  components:
  - type: WFRadioOperator
  # His own radio set: Shortband away from any telecom server.
  - type: TelecomExempt

- type: wfCrewRole
  id: WFCrewMarine
  mob: WFMobCrewMarine
  duty: Guard
  engagement: OnSight
  title: wf-crew-role-marine
  order: 30

- type: wfCrewRole
  id: WFCrewDeckhand
  mob: WFMobCrewDeckhand
  duty: Guard
  engagement: OnSight
  title: wf-crew-role-deckhand
  order: 40
