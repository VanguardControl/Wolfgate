# Orbit decay (F11). Not selectable either: WFOrbitDecaySystem sets it when a grid on an orbit layer loses
# station-keeping, and hands the ship its own code back if the thrusters come up again.
- type: shipAlertCode
  id: WFAlertOrbitDecay
  name: wf-alert-orbit-decay
  description: wf-alert-orbit-decay-desc
