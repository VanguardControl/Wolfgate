# Ship PA situation codes shown as buttons on the pilot console's PA & Alarms panel.
# Setting one dirties ShipAlertComponent.Code and broadcasts `announcement` through the ship's speakers.
- type: shipAlertCode
  id: ShipCodeGreen
  name: ship-alert-code-green
  description: ship-alert-code-green-desc
  announcement: ship-alert-code-green-announcement
  color: "#3fe05a"
  order: 0
  sound: /Audio/Announcements/attention.ogg

- type: shipAlertCode
  id: ShipCodeYellow
  name: ship-alert-code-yellow
  description: ship-alert-code-yellow-desc
  announcement: ship-alert-code-yellow-announcement
  color: "#ffd23f"
  order: 1
  sound: /Audio/Misc/bluealert.ogg

- type: shipAlertCode
  id: ShipCodeRed
  name: ship-alert-code-red
  description: ship-alert-code-red-desc
  announcement: ship-alert-code-red-announcement
  color: "#ff3030"
  order: 2
  sound: /Audio/Misc/redalert.ogg

- type: shipAlertCode
  id: ShipCodeBlack
  name: ship-alert-code-black
  description: ship-alert-code-black-desc
  announcement: ship-alert-code-black-announcement
  color: "#d0d0d0"
  order: 3
  sound: /Audio/Announcements/war.ogg

# Atmospheric flight callouts (F10). Not selectable: WFFlightAlarmSystem drives them off a hull's lift-lost state and
# hands the ship its own code back when the descent is over.
- type: shipAlertCode
  id: WFAlertLiftLost
  name: wf-alert-lift-lost
  description: wf-alert-lift-lost-desc
  announcement: wf-alert-lift-lost-announcement
  color: "#ffd23f"
  order: 10
  selectable: false
  sound: /Audio/_WF/PlanetCracker/Flight/lift_lost.ogg

