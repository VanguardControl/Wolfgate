# 2 steel + 1 rod; the construction menu can't start a structure on a tool step. Deconstruct: welder then wrench, returns the materials.
- type: constructionGraph
  id: WFTetherAnchorEye
  start: start
  graph:
  - node: start
    edges:
    - to: eye
      steps:
      - material: Steel
        amount: 2
        doAfter: 2
      - material: MetalRod
        amount: 1
        doAfter: 1

  - node: eye
    entity: WFTetherAnchorEye
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:SpawnPrototype
        prototype: PartRodMetal1
        amount: 1
      - !type:DeleteEntity {}
      steps:
      - tool: Welding
        doAfter: 2
      - tool: Anchoring
        doAfter: 2
