# Limbs the creator's Augments tab puts on a character. A limb's look comes from the style picked
# with it (styles.yml); the sprite here is only what it shows as an item. They are free, so they take
# WFAugmentBodyPartProfile (wounds.yml) rather than the stock cybernetic part's painless one.

- type: entity
  parent: LeftArmCyberneticBase
  id: WFAugmentLeftArm
  name: cybernetic left arm
  description: A plain cybernetic left arm, built to replace the one its owner lost or gave up.
  components:
  - type: Woundable
    profile: WFAugmentBodyPartProfile
  - type: GenerateChildPart
    id: WFAugmentLeftHand

- type: entity
  parent: RightArmCyberneticBase
  id: WFAugmentRightArm
  name: cybernetic right arm
  description: A plain cybernetic right arm, built to replace the one its owner lost or gave up.
