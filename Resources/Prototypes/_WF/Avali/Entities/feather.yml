- type: entity
  parent: BaseItem
  id: AvaliFeather
  name: ent-AvaliFeather
  description: ent-AvaliFeather-desc
  components:
  - type: Appearance
  - type: Sprite
    sprite: _WF/Avali/feather.rsi
    layers:
    - state: feather
      map: [ "enum.FeatherVisualLayers.Feather" ]
    - state: featherblood
      color: "#FFFFFF00"
      map: [ "enum.FeatherVisualLayers.Blood" ]
  - type: Flammable
    fireSpread: true
    alwaysCombustible: true
    damage:
      types:
        Heat: 1
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: fire
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Item
    size: Tiny
  - type: Clothing
    sprite: _WF/Avali/feather.rsi
    clothingVisuals:
      ears:
      - state: equipped-EARS
        map: [ "ears-feather" ]
      head:
      - state: equipped-HELMET
        map: [ "head-feather" ]
    slots:
    - ears
    - head
  - type: Tag
    tags:
    - Write
    - Pen
    - Trash
  - type: Feather
