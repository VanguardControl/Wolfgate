# Gravity anchors and their crates.

- type: entity
  id: WFGravityAnchor
  parent: BaseStructureDynamic
  name: gravity anchor
  description: A squat drilling rig on hydraulic legs, far too heavy to carry and just about draggable.
  components:
  - type: Sprite
    sprite: _WF/PlanetCracker/Structures/gravity_anchor.rsi
    noRot: true
    layers:
    - map: [ "enum.WFAnchorVisualLayers.Base" ]
      state: off
    - map: [ "enum.WFAnchorVisualLayers.Glow" ]
      state: drilling-unshaded
      shader: unshaded
      visible: false
    - map: [ "enum.WFAnchorVisualLayers.Damage" ]
      state: damaged
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WFAnchorVisuals.State:
        enum.WFAnchorVisualLayers.Base:
          Loose:    { state: off }
          Deployed: { state: deployed }
          Paired:   { state: deployed }
          Drilling: { state: drilling }
          Locked:   { state: locked }
          Off:      { state: off }
          Broken:   { state: broken }
        enum.WFAnchorVisualLayers.Glow:
          Loose:    { visible: false }
          Deployed: { visible: false }
          Paired:   { visible: false }
          Drilling: { visible: true, state: drilling-unshaded }
          Locked:   { visible: true, state: locked-unshaded }
          Off:      { visible: false }
          Broken:   { visible: false }
      enum.WFAnchorVisuals.Damaged:
        enum.WFAnchorVisualLayers.Damage:
          True:  { visible: true }
          False: { visible: false }
  - type: InteractionOutline
  - type: Transform
    anchored: false
    noRot: true
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.5,-1.5,1.5,1.5"
        density: 50          # 9 m2 x 50 = 450 mass, matching the stock 3x3 gravity generator
        mask:
        - MachineMask
        layer:               # not Impassable, so a deployed anchor does not bounce a passing hull
        - MidImpassable
        - LowImpassable
  - type: Anchorable
    delay: 8
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300          # keep in sync with WFGravityAnchorComponent.BreakDamage
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Repairable
    # BaseStructure narrows this to Applicating, so Welding is re-added.
    qualities:
    - Welding
    - Applicating
    fuelCost: 15
    doAfterDelay: 8
  - type: AmbientSound
    enabled: false
    sound:
      path: /Audio/_WF/PlanetCracker/Crack/planet_side_anchor_loop.ogg
    range: 12
    volume: -4
  - type: WFGravityAnchor
  - type: WFFissureSpawner
  - type: StaticPrice
    price: 0

- type: entity
  id: WFAnchorCrate
  parent: BaseStructureDynamic
  name: gravity anchor crate
  description: A reinforced shipping crate with lift points. Pry it open on a planet surface.
  components:
  # A 32x32 crate scaled 2x for the 2x2 fixture; the mapped layer is the lid, over the unmapped body.
  - type: Sprite
    sprite: Structures/Storage/Crates/engicrate_secure.rsi
    noRot: true
    scale: 2, 2
    layers:
    - state: base
    - map: [ "enum.WFCrateVisualLayers.Base" ]
      state: closed
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      # Unused for now: uncrating deletes the crate.
      enum.WFCrateVisuals.Open:
        enum.WFCrateVisualLayers.Base:
          True:  { state: open }
          False: { state: closed }
  - type: InteractionOutline
  - type: Transform
    anchored: false
    noRot: true
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.0,-1.0,1.0,1.0"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Anchorable
    flags: None              # crates are dragged, never wrenched down
  - type: WFAnchorCrate
    contents: WFGravityAnchor
    tool: Prying
    delay: 6
  - type: StaticPrice
    price: 0                 # hull-shipped crates must not inflate its appraisal

- type: entity
  id: WFAnchorCrateReplacement
  parent: WFAnchorCrate
  name: replacement gravity anchor crate
  suffix: Replacement
  components:
  # The lock light marks the bought replacement.
  - type: Sprite
    sprite: Structures/Storage/Crates/engicrate_secure.rsi
    noRot: true
    scale: 2, 2
    layers:
    - state: base
    - map: [ "enum.WFCrateVisualLayers.Base" ]
      state: closed
    - map: [ "enum.WFCrateVisualLayers.Stencil" ]
      state: locked
  - type: StaticPrice
    price: 400000            # the cargo-purchasable replacement
