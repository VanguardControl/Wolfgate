  unsanctionedFaction: WFCarcinomaThreats
  markerLayers:
  - WFDeepVeinsCarcinoma

# Direct mob entries let the existing fissure code enforce its cumulative spawn cap.
- type: salvageFaction
  id: WFCarcinomaThreats
  desc: wf-planet-carcinoma-faction
  cost: 1
  groups:
  - entries:
    - id: MobLetoferolBeast
      amount: 1
      maxAmount: 1
    prob: 0.9
  - entries:
    - id: MobLetoferolHorror
      amount: 1
      maxAmount: 1
    prob: 0.1
