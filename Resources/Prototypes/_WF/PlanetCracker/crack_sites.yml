# What cracking knows about each world: its deep-vein table, the fissure factions and the deep-vein marker layers.
# The marker layers are added after the planet's own, so every other layer keeps its placement.
# Site-threat factions are ground mobs with NavSmash, since flying carps never collide with an anchor.

- type: wfCrackSite
  id: WFCrackSiteAsclepiu
  surface: WFSurfaceAsclepiu
  veins: WFVeinTableAsclepiu
  faction: Xenos
  unsanctionedFaction: Argocytes
  markerLayers:
  - WFDeepVeins

- type: wfCrackSite
  id: WFCrackSiteFervidus
  surface: WFSurfaceFervidus
  veins: WFVeinTableFervidus
  faction: Argocytes
  unsanctionedFaction: Argocytes
  markerLayers:
  - WFDeepVeinsFervidus

