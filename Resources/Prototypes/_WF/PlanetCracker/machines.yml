# Cracker hull machines: the gravitic centrifuge, the gravity projector and the anchor transport's gravgen.

- type: entity
  id: WFCentrifuge
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: gravitic centrifuge
  description: A caged ring rotor. Its spin is what holds a ship and a chunk of planet in orbit.
  components:
  - type: Sprite
    sprite: _WF/PlanetCracker/Structures/centrifuge.rsi
    noRot: true
    layers:
    # Both layers are required: the client GravitySystem throws without the Core layer.
    - map: [ "enum.GravityGeneratorVisualLayers.Base" ]
      state: off
    - map: [ "enum.GravityGeneratorVisualLayers.Core" ]
      state: glow-unshaded
      shader: unshaded
  - type: Appearance
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.5,-1.5,1.5,1.5"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Anchorable
    flags: None              # unanchoring zeroes Charge, which would drop the ship
  - type: ApcPowerReceiver
    powerLoad: 12000
  - type: ExtensionCableReceiver
  - type: PowerCharge
    windowTitle: wf-centrifuge-window-title
    idlePower: 200
    activePower: 12000
    charge: 0                # required: the default of 1 would start a hull at full spin
    chargeRate: 0.00417      # 240 s from cold to full
  - type: GravityGenerator
    maxHandledMass: 3000     # never <= 0, which gravity reads as infinite lift
    lightRadiusMin: 0.75
    lightRadiusMax: 3.0
    # The RSI has one core state, so all four point at it.
    coreStartupState: glow-unshaded
    coreIdleState: glow-unshaded
    coreActivatingState: glow-unshaded
    coreActivatedState: glow-unshaded
    spriteMap:
      broken: "broken"
      unpowered: "off"
      off: "off"
      on: "spinning"
  - type: WFCentrifuge
  - type: Repairable
    qualities: [ Welding, Applicating ]   # BaseStructure narrows this to Applicating
    fuelCost: 25
    doAfterDelay: 10
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
  - type: Machine
    board: WFCentrifugeCircuitboard
  - type: ActivatableUI
    key: enum.PowerChargeUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.PowerChargeUiKey.Key:
        # The stock power-charge key and messages, with the rotor window.
        type: WFCentrifugeBoundUserInterface

- type: entity
  id: WFGravityProjector
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: gravity projector
  description: A twin-barrelled hull mount that swings onto an anchor and beams straight down at it.
  # The 64x64 sprite overhangs its inherited 1x1 fixture, so keep mapped projectors at least 2 tiles apart.
  components:
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/artillery.rsi
    layers:
    - map: [ "enum.WFProjectorVisualLayers.Base" ]
      state: space_artillery
    - map: [ "enum.WFProjectorVisualLayers.Emitter" ]
      state: fcs-unshaded
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WFProjectorVisuals.State:
        # One body state, so off and broken are told apart by tint.
        enum.WFProjectorVisualLayers.Base:
          Off:      { state: space_artillery, color: "#888888" }
          Idle:     { state: space_artillery, color: "#ffffff" }
          Charging: { state: space_artillery, color: "#ffffff" }
          Firing:   { state: space_artillery, color: "#ffffff" }
          Broken:   { state: space_artillery, color: "#7a4a4a" }
        enum.WFProjectorVisualLayers.Emitter:
          Off:      { visible: false }
          Idle:     { visible: false }
          Charging: { visible: true }
          Firing:   { visible: true }
          Broken:   { visible: false }
  - type: Transform
    anchored: true
    noRot: false             # free-rotating mount: the mapper faces it outward, the cut swings it onto its anchor
  - type: Rotatable
    rotateWhileAnchored: true
  - type: ApcPowerReceiver
    powerLoad: 6000
  - type: WFGravityProjector
  - type: Machine
    board: WFGravityProjectorCircuitboard
  - type: Repairable
    qualities: [ Welding, Applicating ]
    fuelCost: 20
    doAfterDelay: 8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Breakage" ]

- type: entity
  id: WFTransportGravgen
  parent: GravityGeneratorMini
  name: transport gravity generator
  suffix: Anchor transport
  description: Rated for one hull and one anchor. The placard is very clear about the "one".
  components:
  - type: GravityGenerator
    maxHandledMass: 40       # hull 31.5 + one crated anchor 6 flies; a second anchor drops it
  - type: WFAnchorCapacity
    capacity: 1
