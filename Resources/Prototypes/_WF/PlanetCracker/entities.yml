# Centre marker of an orbit layer, spawned at the planet centre. A warp point and a radar label only:
# orbit is not an FTL destination, so this deliberately carries no FTLBeacon.

- type: entity
  id: WFOrbitBeacon
  name: Orbital marker # Renamed at spawn
  categories: [ HideSpawnMenu ]
  components:
    - type: WarpPoint
      adminOnly: true
    - type: FTLSmashImmune
    - type: IFF
      color: '#7FFFD4'
