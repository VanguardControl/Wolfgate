# Remaining Kyphrus worlds. Terrain uses existing art and biome templates.
# Gravity, temperatures and yields are initial gameplay tuning, not conversions of sector-sprite mass.
# All worlds initially permit cracking; legality can be balanced independently later.
# Thrascias deliberately has a fictional solid frozen surface despite its ice-giant sector sprite.

- type: wfPlanetSurface
  id: WFSurfaceFervidus
  planetType: PlanetFervidus
  ground: WFFervidusSurface
  airLayers: 3
  cloudLayer: false
  orbitRange: 2000
  buildAtRoundStart: true
  sanctioned: true
  gravity: 0.9
  seed: 20260914
  veins: WFVeinTableFervidus
  faction: Argocytes
  unsanctionedFaction: Argocytes
  networkComponents:
  - type: MapAtmosphere
    space: false
    mixture:
      volume: 2500
      immutable: true
      temperature: 373.15
      moles: [0, 75, 25]
  groundComponents:
  - type: CEZLevelRoof
  - type: CEZGroundLayer
  airComponents:
  - type: MapLight
    ambientLightColor: "#a87866"
  - type: Gravity
    enabled: true
    inherent: true
  orbitComponents:
  - type: MapLight
    ambientLightColor: "#2a3340"

- type: planet
  id: WFFervidusSurface
  biome: WFBiomeFervidus
  mapName: wf-planet-fervidus-surface
  mapLight: "#c48b71"
  atmosphere:
    volume: 2500
    immutable: true
    temperature: 373.15
    moles: [0, 75, 25]
  biomeMarkerLayers:
  - OreIron
  - OreQuartz
  - OreCoal
  - OreGold
  - OreSilver
  - OrePlasma
  - OreUranium
  - WFDeepVeinsFervidus

- type: biomeTemplate
  id: WFBiomeFervidus
  layers:
  # A guaranteed floor below the borrowed template prevents incidental noise gaps.
  - !type:BiomeTileLayer
    threshold: -1
    tile: FloorBasalt
  - !type:BiomeMetaLayer
    threshold: -1
    template: WFOpenBasalt

- type: entity
  id: WFDeepVeinFervidus
  parent: WFDeepVein
  components:
  - type: WFDeepVein
    allowedTiles: [FloorBasalt]

- type: biomeMarkerLayer
  id: WFDeepVeinsFervidus
  prototype: WFDeepVeinFervidus
  size: 128
  radius: 12
  maxCount: 93
  minGroupSize: 1
  maxGroupSize: 1

- type: wfVeinTable
  id: WFVeinTableFervidus
  ores:
    OreSteel: { weight: 5, value: 1 }
    OreSpaceQuartz: { weight: 2, value: 2 }
    OreGold: { weight: 1, value: 6 }
    OrePlasma: { weight: 4, value: 7 }
    OreUranium: { weight: 3, value: 9 }
  yieldRange: 2000, 4500
  unsanctionedMultiplier: 2
  rate: 150

