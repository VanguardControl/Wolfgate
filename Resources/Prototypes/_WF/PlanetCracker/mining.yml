# The crack miner: the machine that turns a chunk's deep veins into ore.

- type: entity
  id: WFCrackMiner
  parent: [ BaseMachine, ConstructibleMachine ]
  name: crack miner
  description: A drill head on a squat frame with a battery bay, heavy but draggable. It only bites on cut crust.
  # Cell-powered, since a chunk has no grid power. Spawns unanchored and Dynamic so it can be dragged between veins.
  # The cell slot container is declared for the prototype save test. The 64x64 sprite overhangs its 1x1 fixture,
  # so keep mapped miners at least 2 tiles apart.
  components:
  - type: Sprite
    sprite: _WF/PlanetCracker/Structures/crack_miner.rsi
    noRot: true
    layers:
    - map: [ "enum.WFCrackMinerVisualLayers.Base" ]
      state: idle
    - map: [ "enum.WFCrackMinerVisualLayers.Glow" ]
      state: mining-unshaded
      shader: unshaded
      visible: false
  - type: Transform
    anchored: false
    noRot: true
  - type: Physics
    bodyType: Dynamic
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WFCrackMinerVisuals.State:
        # No `off` state in crack_miner.rsi, so Idle doubles as off.
        enum.WFCrackMinerVisualLayers.Base:
          Idle:      { state: idle }
          Mining:    { state: mining }
          Exhausted: { state: exhausted }
          Broken:    { state: broken }
        enum.WFCrackMinerVisualLayers.Glow:
          Idle:      { visible: false }
          Mining:    { visible: true }
          Exhausted: { visible: false }
          Broken:    { visible: false }
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      cell_slot: !type:ContainerSlot
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: false     # a machine must not go into a recharger
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
        ejectOnInteract: true
        whitelist:
          tags:
          # Both tags: PowerCellSmall carries only its own.
          - PowerCell
          - PowerCellSmall
        blacklist:
          components:
          # Self-recharging cells never empty. Server-only in effect: the client lacks the component and mispredicts.
          - BatterySelfRecharger
        whitelistFailPopup: wf-crack-miner-cell-rejected
  # AnchorableSystem handles a wrench before ItemSlots does.
  - type: AmbientSound
    enabled: false
    sound:
      path: /Audio/Ambience/Objects/circular_saw.ogg
    range: 8
    volume: -5
  # The ambient sound above is toggled by WFCrackMinerSystem.SetState.
  - type: Repairable
    qualities: [ Welding, Applicating ]
    fuelCost: 15
    doAfterDelay: 8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  # BaseMachine has no Breakage threshold, so the one above makes the `broken` state reachable.
  - type: Machine
    board: WFCrackMinerCircuitboard
  - type: WFCrackMiner

- type: entity
  id: WFCrackMinerEmpty
  parent: WFCrackMiner
  suffix: Empty
  # No starting cell; the cell-behaviour tests use this one.
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        ejectOnInteract: true
        whitelist:
          tags:
          - PowerCell
          - PowerCellSmall
        blacklist:
          components:
          # Server-only in effect, as on the parent.
          - BatterySelfRecharger
        whitelistFailPopup: wf-crack-miner-cell-rejected
