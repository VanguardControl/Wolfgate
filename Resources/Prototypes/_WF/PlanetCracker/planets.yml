# Binds the Asclepiu sector body to its surface and describes the whole z-stack.

- type: wfPlanetSurface
  id: WFSurfaceAsclepiu
  planetType: PlanetAsclepiu
  ground: WFAsclepiuSurface
  # No cloud layer on a crackable world, and a third air layer in its place.
  # ScalingViewport.RenderZLevels breaks its downward walk at the first CEZCloudLayerComponent
  # (ScalingViewport.CEZLevels.cs:185-190) and the cloud's own pass then paints an opaque full-screen
  # deck at :377, so from orbit the crack site was invisible and WFCrackCircleOverlay never got a pass
  # to draw into. Dropping the cloud is the whole fix and costs no code.
  # airLayers goes 2 -> 3 in the same edit because cloudComponents was never only a cloud: it carried
  # the same MapLight and inherent Gravity as airComponents (see cloudComponents below), so it was a
  # third gravity-bearing air layer. Raising airLayers keeps the stack five maps deep with orbit still
  # at depth 4, which preserves every fall duration and touchdown number keyed to that shape.
  airLayers: 3
  cloudLayer: false
  orbitRange: 2000
  buildAtRoundStart: true
  sanctioned: true
  veins: WFVeinTableAsclepiu
  # salvageFaction ids (Resources/Prototypes/Procedural/salvage_factions.yml:2 and :226) for F8's site
  # threats. Both are ground mobs carrying NavSmash, which is what lets them chew a deployed anchor;
  # Carps is deliberately not used because carps fly on FlyingMobMask and never collide with the
  # anchor's MidImpassable/LowImpassable fixture.
  faction: Xenos
  unsanctionedFaction: Argocytes
  # Fixes the ground biome seed so the same planet yields the same terrain and the same deep veins every round.
  # Without it PlanetSystem.SpawnPlanet passes no seed and EnsurePlanet rolls _random.Next() (BiomeSystem.PlanetSetup.cs:33).
  seed: 20260913
  # Stamped on every member map at MapInit with removeExisting true, and onto every transit map.
  # Only the atmosphere belongs here: anything else would clobber what the ground layer already has,
  # and moving the atmosphere out would make every transit gap vacuum.
  networkComponents:
  - type: MapAtmosphere
    space: False
    mixture:
      volume: 2500
      immutable: True
      temperature: 293.15
      moles:
      - 21.824879
      - 82.10312
  groundComponents:
  - type: CEZLevelRoof
  - type: CEZGroundLayer
  airComponents:
  - type: MapLight
    ambientLightColor: "#c8fdff"
  - type: Gravity
    enabled: true
    inherent: true
  # Left in place for planets that still want a deck; WFSurfaceAsclepiu no longer asks for one.
  cloudComponents:
  - type: CEZCloudLayer
  - type: MapLight
    ambientLightColor: "#c8fdff"
  - type: Gravity
    enabled: true
    inherent: true
  # WFPlanetNetworkSystem RemComps MapLightComponent from the orbit map (WFPlanetNetworkSystem.cs:215),
  # and the engine falls back to sRGB black with none present, so the chunk and every parked hull would
  # otherwise be unlit. No Gravity here: per-grid inherent gravity is the chunk's own (F5).
  orbitComponents:
  - type: MapLight
    ambientLightColor: "#2a3340"
