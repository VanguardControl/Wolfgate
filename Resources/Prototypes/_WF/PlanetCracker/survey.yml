# The handheld surveyor and its pulse effect.

- type: entity
  id: WFSurveyor
  parent: BaseItem
  name: handheld surveyor
  description: Pulses the ground and paints back whatever is dense enough to be worth cracking for.
  components:
  - type: Sprite
    sprite: Objects/Specific/Research/anomalylocator.rsi
    state: icon
  - type: Item
  - type: UseDelay
    delay: 8
  - type: WFSurveyor
  # No ItemToggle: its use-in-hand handler would eat the scan.

# The one-shot ground pulse, drawn by the singularity lensing shader instead of a sprite.
- type: entity
  id: WFEffectSurveyPulse
  name: survey pulse
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.48
  # A ripple about a tile out; it marks the pulse, not its reveal range.
  - type: SingularityDistortion
    intensity: 400
    falloffPower: 2
  - type: Tag
    tags:
    - HideContextMenu
