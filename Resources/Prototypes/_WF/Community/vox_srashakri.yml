  price: 115000 # appraised at 88970
  category: Medium # 647 tiles
  group: Scrap
  requireCrew: true
  shuttlePath: /SharedMaps/_WF/Community/vox_srashakri.yml
  guidebookPage: null
  class:
  - Pursuit
  - Scrapyard
  - Cargo
  engine:
  - Plasma

