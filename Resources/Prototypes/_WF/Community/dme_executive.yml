# Vessel prototype made in mapping mode from "Exec". Check every field before it goes in the game.
# Grid: put Exec.yml at Resources/SharedMaps/_WF/Community/dme_executive.yml
# Prototype: put this file, Exec.vessel.yml, at Resources/Prototypes/_WF/Community/dme_executive.yml
# Guessed from the grid (343 tiles), not set by the mapper: category, engine. Check them.
# Set by the mapper in the export wizard: name, description, price, class, group, access, requireCrew.

- type: vessel
  id: WFDMEExecutive
  parent: BaseVessel
  name: 'DME Executive'
  description: 'A mid-sized space yacht with a fully stocked bar, pool, library, master bedroom, and crew sleeping quarters. It features sizeable engines with respectable acceleration. While it has a small cargo hold, it is not recommended to use this ship as a freighter.'
  price: 133405 # appraised at 35717
  category: Medium # 343 tiles
  group: Shipyard
  shuttlePath: /SharedMaps/_WF/Community/dme_executive.yml
  guidebookPage: null
  class:
  - Cargo
  - Civilian
  engine:
  - Uranium

- type: gameMap
  id: WFDMEExecutive
  mapName: 'DME Executive'
  mapPath: /SharedMaps/_WF/Community/dme_executive.yml
  minPlayers: 0
  stations:
    WFDMEExecutive:
      stationProto: StandardFrontierVessel
      components:
      - type: StationNameSetup
        mapNameTemplate: 'DME Executive {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: '14'
      - type: StationJobs
        availableJobs:
          Contractor: [ 0, 0 ]
