# A pair of TSF fighters holding station off a station for the whole round. They warn ships that dock with them,
# fight boarders, and only drive attackers off.
- type: wfEncounter
  id: WFEncounterTsfPatrol
  name: wf-encounter-name-patrol
  start: RoundStart
  lifetime: Persistent
  category: Patrol
  cost: 1
  replaceable: true
  placement: Station
  standoff: 500
  cooldown: 2400
  ships:
  - key: lead
    vessel: QJ271
    side: patrol
    faction: TSFMC
    company: TSF
    docking: Warn
    disengage: Deter
    disengageRange: 800
    objectives:
    - kind: Circle
      target: "@origin"
      range: 700
  - key: wing
    vessel: QJ271
    offset: 120, 0
    side: patrol
    faction: TSFMC
    company: TSF
    captain: false
    docking: Warn
    disengage: Deter
    disengageRange: 800
    objectives:
    - kind: Escort
      target: lead

# Independent freight runs. A hauler enters the sector well out from its first stop, its captain calls its cargo
# and route on the common channel, and it docks at two to four stations in turn before flying clear and jumping out.
# The crew are ordinary spacers in working clothes: the hands don't fight, and an officer may have the only gun.
- type: wfEncounter
  id: WFEncounterFreightSmall
  name: wf-encounter-name-freighter
  announcement: wf-encounter-announce-freight-run
  announceOnRadio: true
  start: Scheduled
  category: Traffic
  cost: 1
  weight: 3
  minPlayers: 0
  placement: Circuit
  cooldown: 1500
  duration: 5400
  route:
    minStops: 2
    maxStops: 4
  manifests: [ WFManifestGeneral, WFManifestFood, WFManifestMedical, WFManifestIndustrial, WFManifestParts ]
  ships:
  - key: freighter
    vessels:
    - Plutomkii
    - Twilight
    side: freight
    profile: WFCrewProfileHauler
    deckhands: 1
    guards: 0
    captain: false
    cargo: 4
    flyRoute: true
    boarding: Warn
    docking: Warn
    disengage: Deter

