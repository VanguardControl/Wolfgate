# A pair of TSF fighters holding station off a station for the whole round. They warn ships that dock with them,
# fight boarders, and only drive attackers off. Ships of a company the TSF is at war with are warned off at 900 m
# and fired on inside 450 m; everyone else may pass.
- type: wfEncounter
  id: WFEncounterTsfPatrol
  name: wf-encounter-name-patrol
  start: RoundStart
  lifetime: Persistent
  category: Patrol
  cost: 1
  replaceable: true
  placement: Station
  standoff: 500
  cooldown: 2400
  ships:
  - key: lead
    navigation: WFCrewNavigationWarship
    vessel: QJ271
    side: patrol
    faction: TSFMC
    company: TSF
    profile: WFCrewProfileTsf
    docking: Warn
    disengage: Deter
    disengageRange: 1200
    warnRange: 900
    attackRange: 450
    zoneTargets: AtWar
    objectives:
    - kind: Circle
      target: "@origin"
      range: 700
  - key: wing
    navigation: WFCrewNavigationWarship
    vessel: QJ271
    offset: 120, 0
    side: patrol
    faction: TSFMC
    company: TSF
    profile: WFCrewProfileTsf
    captain: false
    docking: Warn
    disengage: Deter
    disengageRange: 1200
    warnRange: 900
    attackRange: 450
    zoneTargets: AtWar
    objectives:
    - kind: Escort
      target: lead

# Independent freight runs. A hauler enters the sector well out from its first stop, its captain calls its cargo
# and route on the common channel, and it docks at two to four stations in turn before flying clear and jumping out.
# The crew are ordinary spacers in working clothes: the hands don't fight, and an officer may have the only gun.
- type: wfEncounter
  id: WFEncounterFreightSmall
  name: wf-encounter-name-freighter
  announcement: wf-encounter-announce-freight-run
  announceOnRadio: true
  start: Scheduled
  category: Traffic
  cost: 1
  weight: 3
  minPlayers: 0
  placement: Circuit
  cooldown: 1500
  duration: 5400
  route:
    minStops: 2
    maxStops: 4
  manifests: [ WFManifestGeneral, WFManifestFood, WFManifestMedical, WFManifestIndustrial, WFManifestParts ]
  ships:
  - key: freighter
    navigation: WFCrewNavigationFreight
    vessels:
    - Plutomkii
