  id: WFEncounterPirateRaiders
  stationClearance: 3000
  name: wf-encounter-name-pirates
  start: Scheduled
  category: Threat
  cost: 2
  weight: 2
  minPlayers: 3
  cooldown: 2400
  duration: 3600
  minDistance: 2500
  maxDistance: 4500
  ships:
  - key: raider
    navigation: WFCrewNavigationRaider
    vessels: [ Osa, Scorpion ]
    side: pirates
    faction: PirateNF
    distress: false
    company: PDV
    profile: WFCrewProfilePirate
    deckhands: 3
    wander: 6
    wanderRadius: 3000
    warnRange: 900
