# A TSF transport carrying munitions under fighter escort. It holds its course whatever happens, warns ships of
# other companies off at a kilometre and fires on them inside four hundred metres.
- type: wfEncounter
  id: WFEncounterTsfTransport
  name: wf-encounter-name-tsf-transport
  announcement: wf-encounter-announce-tsf-transport
  announceOnRadio: true
  start: Scheduled
  category: Patrol
  cost: 3
  weight: 1
  minPlayers: 6
  placement: Circuit
  cooldown: 3600
  duration: 5400
  route:
    minStops: 1
    maxStops: 2
    dwellMin: 180
    dwellMax: 300
  manifests: [ WFManifestMunitions ]
  ships:
  - key: transport
    vessel: Argent
    side: tsf
    faction: TSFMC
    company: TSF
    profile: WFCrewProfileTsf
    deckhands: 2
    guards: 2
    cargo: 8
    flyRoute: true
    evades: false
    disengage: Deter
    disengageRange: 1200
    warnRange: 1000
    attackRange: 400
  - key: escort
    vessel: QJ271
    offset: 150, 0
    side: tsf
    faction: TSFMC
    company: TSF
    profile: WFCrewProfileTsf
    captain: false
    disengage: Deter
    disengageRange: 1200
    objectives:
    - kind: Escort
      target: transport

# A hauler in open space with a pirate ship on it. Hidden until someone raises the alarm; then it is a distress call.
- type: wfEncounter
  id: WFEncounterPirateAmbush
  name: wf-encounter-name-ambush
  announcement: wf-encounter-announce-ambush
  announcementSender: wf-encounter-sender-traffic
  start: Scheduled
  category: Distress
  cost: 2
  hidden: true
  minPlayers: 4
  cooldown: 2700
  duration: 2400
  ships:
  - key: hauler
    vessel: Piva
    side: freight
    company: TSFCivilian
    docking: Warn
    disengage: Deter
    objectives:
    - kind: Hold
  - key: raider
    vessel: Osa
    offset: 0, 450
    side: pirates
    faction: PirateNF
    company: PDV
    skill: Regular
    objectives:
    - kind: Attack
      target: hauler
