# A hauler in open space with a pirate ship lying off it. The hauler's distress call goes out at once; the attack
# only begins when a player comes within a kilometre and a half, so somebody is there to see it.
- type: wfEncounter
  id: WFEncounterPirateAmbush
  name: wf-encounter-name-ambush
  announcement: wf-encounter-announce-ambush
  announcementSender: wf-encounter-sender-traffic
  start: Scheduled
  category: Distress
  cost: 2
  startRadius: 1500
  rewards:
  - side: freight
    spesos: 12000
    thanks: wf-encounter-reward-thanks-hauler
  minPlayers: 4
  cooldown: 2700
  duration: 2400
  ships:
  - key: hauler
    navigation: WFCrewNavigationFreight
    vessel: Piva
    side: freight
    profile: WFCrewProfileHauler
    company: TSFCivilian
    docking: Warn
    disengage: Deter
    objectives:
    - kind: Hold
  - key: raider
    navigation: WFCrewNavigationRaider
    vessel: Osa
    offset: 0, 450
    side: pirates
    faction: PirateNF
    distress: false
    company: PDV
    profile: WFCrewProfilePirate
    objectives:
    - kind: Attack
      target: hauler

# Pirates on the prowl: two raiders arrive in open space near traffic, meander from point to point for a while and
