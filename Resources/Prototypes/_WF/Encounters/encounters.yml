    captain: false
    warnRange: 900
    attackRange: 450
    zoneLines: wf-encounter-pirate-zone
    objectives:
    - kind: Escort
      target: raider

# Pirate boarders: one small, lightly armed ship that gives no warning. It runs down the nearest player ship and
# tries to dock; every time it is shaken off it comes again. If it gets a port, its hands come aboard, shoot at
# whoever they see, carry off a few loose things, and the ship casts off and jumps out.
- type: wfEncounter
  id: WFEncounterPirateBoarders
  stationClearance: 3000
  name: wf-encounter-name-boarders
  start: Scheduled
  category: Threat
  cost: 2
  weight: 2
  minPlayers: 2
  hidden: true
  cooldown: 2400
  duration: 1800
  minDistance: 1500
  maxDistance: 2500
  ships:
  - key: boarder
    navigation: WFCrewNavigationRaider
    vessel: Gadfly
    side: pirates
    faction: PirateNF
    distress: false
    company: PDV
    profile: WFCrewProfilePirate
    captain: false
    deckhands: 2
    guards: 2
    hunt: true
    evades: false

# A wandering trader: a small hauler with a pilot and a trader aboard, drifting from point to point and stopping a
# while at each. Dock with it and deal; the stock is small, cheap and gone when it is gone. Both can be killed.
- type: wfEncounter
  id: WFEncounterWanderingTrader
  name: wf-encounter-name-trader
  announcement: wf-encounter-announce-trader
  announcementSender: wf-encounter-sender-traffic
  start: Scheduled
  category: Traffic
  cost: 1
  weight: 2
  cooldown: 2400
  duration: 3600
  minDistance: 1500
  maxDistance: 3000
  ships:
  - key: trader
    navigation: WFCrewNavigationFreight
    vessel: Piva
    side: trader
    profile: WFCrewProfileHauler
    captain: false
    deckhands: 0
    roles: [ WFCrewPilot ]
    passengers: [ WFTraderWanderer ]
    wander: 4
    wanderRadius: 2500
    wanderPause: 300
    boarding: Ignore
    docking: Ignore
    disengage: Deter

# A TSF patrol ship has been jumped by pirates and calls for backup. Shoot the pirates and the TSF ship takes you
# for an ally and pays when they are beaten; TSF players get military credits as well. Shoot the TSF ship and the
# pirates leave you be, but they pay nothing: what you can take off the wreck is the reward.
- type: wfEncounter
  id: WFEncounterBackupRequest
  name: wf-encounter-name-backup
