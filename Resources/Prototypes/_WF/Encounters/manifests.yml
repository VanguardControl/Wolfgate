# What a freight run may be carrying. One is picked per run; the captain names it and the hold is filled from it.
# A crate listed twice is twice as likely. Most are the cargo catalogue's own crates, so they sell at any pallet for
# what is in them, about a thousand to fifteen hundred spesos, with a rare dearer one; the crates no catalogue has
# are in crates.yml.

