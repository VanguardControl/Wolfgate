# What a freight run may be carrying. One is picked per run; the captain names it and the hold is filled from it.

- type: wfEncounterManifest
  id: WFManifestGeneral
  name: wf-encounter-cargo-general
  crates:
  - CrateServiceJanitorialSupplies
  - CrateFunPlushie
  - CrateMaterialPlastic
  - CrateFoodSoftdrinks
  - CrateEngineeringToolbox

