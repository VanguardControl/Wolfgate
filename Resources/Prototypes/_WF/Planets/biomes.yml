# Asclepiu: temperate continents dotted with lakes, and polar snow.

- type: biomeTemplate
  id: WFBiomeAsclepiu
  layers:
  - !type:BiomeMetaLayer
    template: WFTemperatePlains
    threshold: -1
    noise:
      frequency: 0.001
      noiseType: OpenSimplex2
      fractalType: FBm
      octaves: 2
      lacunarity: 2
  # Lakes some 8 to 40 tiles across, a couple to every hundred tiles square, not seas.
  - !type:BiomeMetaLayer
    template: WFTemperateLake
    threshold: 0.78
    noise:
      seed: 71
      frequency: 0.012
      noiseType: OpenSimplex2
      fractalType: FBm
      octaves: 2
      lacunarity: 2
  - !type:BiomeMetaLayer
    template: WFTemperateSnow
    threshold: 0.5
    noise:
      frequency: 0.001
      noiseType: OpenSimplex2
      fractalType: FBm
      octaves: 2
      lacunarity: 2
