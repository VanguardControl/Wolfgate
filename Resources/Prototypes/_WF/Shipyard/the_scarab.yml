# Vessel prototype made in mapping mode from "Drydock ship". Check every field before it goes in the game.
# Grid: put Drydock ship.yml at Resources/SharedMaps/_WF/Community/the_scarab.yml
# Prototype: put this file, Drydock ship.vessel.yml, at Resources/Prototypes/_WF/Community/the_scarab.yml
# Set by the mapper in the export wizard: name, description, price, category, class, group, engine, access, requireCrew.

- type: vessel
  id: WFTheScarab
  parent: BaseVessel
  name: 'The Scarab'
  description: 'A large drydock ship for a crew of engineer and salvager. it is designed to assist ships around the sector, fixing, towing, powering and assisting in upgrade.'
  price: 225000 # appraised at 144681
  category: Large # 1041 tiles
  group: Shipyard
  requireCrew: true
  shuttlePath: /SharedMaps/_WF/Community/the_scarab.yml
  guidebookPage: null
  class:
  - Scrapyard
  - Salvage
  - Engineering
  engine:
  - AME

- type: gameMap
  id: WFTheScarab
  mapName: 'The Scarab'
  mapPath: /SharedMaps/_WF/Community/the_scarab.yml
  minPlayers: 0
  stations:
    WFTheScarab:
      stationProto: StandardFrontierVessel
      components:
      - type: StationNameSetup
        mapNameTemplate: 'The Scarab {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: '14'
      - type: StationJobs
        availableJobs:
          Contractor: [ 0, 0 ]
