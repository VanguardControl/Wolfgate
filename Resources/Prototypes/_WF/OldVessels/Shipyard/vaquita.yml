- type: vessel
  id: Vaquita
  parent: BaseVessel
  name: DIS Vaquita
  description: A small craft equipped with all the necessary gear for optimal lone salvaging. Including camera mounted mining pulsers and a large thrusters for those quick getaways. "Mine from the cockpit without lifting a finger !" or at least, that's how the DIS advertises it.
  price: 52014
  purchasable: false
  category: Small
  group: Custom # was Shipyard; Custom keeps it off every shipyard console
  mapchecker_group_override: Shipyard
  shuttlePath: /SharedMaps/_WF/OldVessels/vaquita.yml
  tags:
  - WFOldVessel
  guidebookPage: Null
  class:
  - Salvage
  engine:
  - Uranium

