- type: vessel
  id: Parabellum
  parent: BaseVessel
  name: Parabellum
  description: The parabellum is a patrol boat, made for escorting and unsuprisingly; patrolling stations and depots from any malicious ships. It's equipped with EMP launchers, as well as a hybrid EMP Missile launcher for more tougher encounters.
  price: 155258
  purchasable: false
  category: Medium
  group: Custom # was Sr; Custom keeps it off every shipyard console
  access: Brig # Oddball, matches guard ID, specific enough to exclude cadets
  mapchecker_group_override: Security  # Treat this as a security vessel for mapchecker purposes
  shuttlePath: /SharedMaps/_WF/OldVessels/parabellum.yml
  tags:
  - WFOldVessel
  guidebookPage: Null
  class:
  - Civilian
  engine:
  - Uranium

- type: gameMap
  id: Parabellum
  mapName: 'Parabellum'
  mapPath: /SharedMaps/_WF/OldVessels/parabellum.yml
  minPlayers: 0
  stations:
    Parabellum:
      stationProto: StandardFrontierVessel
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Parabellum SEC{1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
