- type: vessel
  id: Claymore
  parent: BaseVessel
  name: ZOB Claymore
  description: A full frontal assault ship, made by the Zealots of Balaam in order to enact the will of their prophet. Features a devastating front facing armnament, much to the detriment of everything else. Any mercenary looking to unleash an awesome frontal barrage can use this ship for their own purposes. Has a MIL designation.
  price: 200000 # BIG BOI TAX
  purchasable: false
  category: Large
  group: Custom # was Shipyard; Custom keeps it off every shipyard console
  mapchecker_group_override: Shipyard
  access: Mercenary
  shuttlePath: /SharedMaps/_WF/OldVessels/claymore.yml
  tags:
  - WFOldVessel
  guidebookPage: Null
  class:
  - Pursuit
  engine:
  - Uranium
  - RTG

