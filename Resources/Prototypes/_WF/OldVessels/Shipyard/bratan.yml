- type: vessel
  id: Bratan
  parent: BaseVessel
  name: PB Bratan
  description: A mobile nightclub, cafeteria, hydroponics, and secret drug lab and smuggling ship, all in one package! Brought to you by the Paycheck Bratva.
  price: 188480
  purchasable: false
  category: Large
  group: Custom # was Shipyard; Custom keeps it off every shipyard console
  mapchecker_group_override: Shipyard
  shuttlePath: /SharedMaps/_WF/OldVessels/bratan.yml
  tags:
  - WFOldVessel
  guidebookPage: Null
  class:
  - Civilian
  - Kitchen
  - Botany
  engine:
  - AME
  - Solar
  addComponents:
  - type: SolarPoweredGrid
    doNotCull: true


- type: gameMap
  id: Bratan
  mapName: 'PB Bratan'
  mapPath: /SharedMaps/_WF/OldVessels/bratan.yml
  minPlayers: 0
  stations:
    Bratan:
      stationProto: StandardFrontierVessel
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Bratan CIV{1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationJobs
          availableJobs:
            Contractor: [ 0, 0 ]
