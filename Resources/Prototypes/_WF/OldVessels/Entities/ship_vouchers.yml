# Carrier LPCs mapped on the restored Ravager (Taser) and Balor (Rac-Man, Bow-Man), removed upstream by Monolith#4624.
# Without them those grids fail to load.

- type: entity
  parent: BaseShipLPCRenewable
  id: ShipVoucherTaser
  name: taser LPC
  description: A small card that contains the data for the procurement of a taser class drone.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon_fighter
    - state: screen
      color: "#eb0023"
    - state: screen7
      color: "#eb0023"
      shader: unshaded
  - type: ShipyardVoucher
    destroyOnEmpty: true
    consoleType: Custom
    companyName: Colonial
    vessels:
    - Taser
  - type: StaticPrice
    vendPrice: 15000

- type: entity
  parent: BaseShipLPCRenewable
  id: ShipVoucherBalor
  name: balor drone LPC
  description: A small card that contains the data for the procurement of a small commercially available anti-drone defense drone.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon_fighter
    - state: screen
      color: "#2E6F40"
    - state: screen8
      color: "#32CD32"
      shader: unshaded
  - type: ShipyardVoucher
    destroyOnEmpty: true
    consoleType: Custom
    vessels:
    - Rac-Man
    - Bow-Man
  - type: StaticPrice
    vendPrice: 30000
