# Carrier LPCs removed upstream by Monolith#4624. The Taser and Balor ones are mapped on the restored Ravager and
# Balor, which fail to load without them; the Ledokol one is the only way to get its rams from its console.

- type: entity
  parent: BaseShipLPCRenewable
  id: ShipVoucherTaser
  name: taser LPC
  description: A small card that contains the data for the procurement of a taser class drone.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon_fighter
    - state: screen
      color: "#eb0023"
    - state: screen7
      color: "#eb0023"
      shader: unshaded
  - type: ShipyardVoucher
    destroyOnEmpty: true
    consoleType: Custom
    companyName: Colonial
    vessels:
    - Taser
  - type: StaticPrice
    vendPrice: 15000

- type: entity
  parent: BaseShipLPCRenewable
  id: ShipVoucherBalor
  name: balor drone LPC
  description: A small card that contains the data for the procurement of a small commercially available anti-drone defense drone.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon_fighter
    - state: screen
      color: "#2E6F40"
    - state: screen8
      color: "#32CD32"
      shader: unshaded
  - type: ShipyardVoucher
    destroyOnEmpty: true
    consoleType: Custom
    vessels:
    - Rac-Man
    - Bow-Man
  - type: StaticPrice
    vendPrice: 30000

- type: entity
  parent: BaseShipLPCRenewable
  id: ShipVoucherLedokolAttachment
  name: USSP Ledokol attachment LPC [T4]
  description: A small card that contains the data for the procurement of attachment modules for the Ledokol.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon_fighter
    - state: screen
      color: "#b40505"
    - state: screen8
      color: "#b40505"
      shader: unshaded
  - type: ShipyardVoucher
    destroyOnEmpty: true
    cooldown: 1800 # thirty minutes
    consoleType: Custom
    companyName: USSP
    vessels:
    - Kopye
    - Molotok
    - Kupol
  - type: StaticPrice
    vendPrice: 50000
