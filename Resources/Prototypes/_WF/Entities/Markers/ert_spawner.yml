# One slot of an admin-built ERT. The ERT Builder fills in the title, briefing, outfit and ID setup at spawn.
- type: entity
  id: WFErtSpawner
  parent: MarkerBase
  name: ERT spawn point
  categories: [ HideSpawnMenu ]
  components:
  - type: GhostRole
    name: ghost-role-information-ert-leader-name
    description: ghost-role-information-ert-leader-description
    rules: ghost-role-information-nonantagonist-rules
    raffle:
      settings: short
  - type: WolfgateErtSpawner
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green
    - state: ertleader
