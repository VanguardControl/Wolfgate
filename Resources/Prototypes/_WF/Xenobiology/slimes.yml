# Ported from Starlight (ss14Starlight/space-station-14, _Starlight/Entities/Mobs/NPCs/xeno_slimes.yml).

- type: entity
  id: XenobiologySlimeBase
  parent:
  - MobRespirator
  - MobAtmosStandard
  - SimpleSpaceMobBase
  abstract: true
  description: A gelatinous lab slime. It eats monkeys, splits when well fed and leaves an extract when processed.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Xenobiology/slimes.rsi
    layers:
    - state: eyes_default
      shader: unshaded
      color: "#333333"
    - state: base1
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: DamageStateVisuals
    states:
      Alive:
        Base: base1
      Critical:
        Base: base1_dead
      Dead:
        Base: base1_dead
  - type: RandomSprite
    available:
    - 0:
        eyes_angry: WFSlimeEyes
        eyes_cat: WFSlimeEyes
        eyes_clown: WFSlimeEyes
        eyes_default: WFSlimeEyes
        eyes_freak: WFSlimeEyes
        eyes_mischief: WFSlimeEyes
        eyes_pins: WFSlimeEyes
        eyes_shocked: WFSlimeEyes
        eyes_smug: WFSlimeEyes
        eyes_squint: WFSlimeEyes
  - type: Hunger
    baseDecayRate: 1
  - type: Slime
    damageOnEat:
      types:
        Cellular: 5
    nutritionOnHit: 10
    mutationChance: 0.25
    mutationOnMaxSplit: XenobiologySlimeRainbow
    splitInto: XenobiologySlimeGray
    extract: GraySlimeExtract
  - type: HTN
    rootTask:
      task: WFSlimeMainCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: Temperature
    heatDamageThreshold: 325
    coldDamageThreshold: 260
    coldDamage:
      types:
        Cold: 10
  - type: MobPrice
    price: 25
  - type: Tag
    tags:
    - WFXenobiologySlime

# Slimes with the shiny base sprite.
- type: entity
  id: XenobiologySlimeShinyBase
  parent: XenobiologySlimeBase
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: eyes_default
      shader: unshaded
      color: "#333333"
    - state: base2
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: DamageStateVisuals
    states:
      Alive:
        Base: base2
      Critical:
        Base: base2_dead
      Dead:
        Base: base2_dead

