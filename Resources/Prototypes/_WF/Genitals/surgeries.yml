# Anatomy surgeries: remove or insert one genital organ through the torso incision with Shitmed's generic organ
# steps (the brain recipe without bone sawing). SurgeryGenitalConsentCondition hides them unless the patient has
# anatomy and adult content on; GenitalSurgery marks them for the server surgeon check and the client list filter.
# No surgery-popup-procedure-WFSurgery* key may exist, so bystanders only see the generic organ popups.

- type: entity
  parent: SurgeryBase
  id: WFSurgeryRemovePenis
  name: Remove penis
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepClampInternalBleeders
    - SurgeryStepRemoveOrgan
  - type: SurgeryPartCondition
    part: Torso
  - type: SurgeryOrganCondition
    organ:
    - type: PenisOrgan
  - type: SurgeryGenitalConsentCondition
  - type: GenitalSurgery

- type: entity
  parent: SurgeryBase
  id: WFSurgeryInsertPenis
  name: Insert penis
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepInsertOrgan
    - SurgeryStepSealOrganWound
  - type: SurgeryPartCondition
    part: Torso
  - type: SurgeryOrganSlotCondition
    organSlot: wf_genital_penis
  - type: SurgeryOrganCondition
    organ:
    - type: PenisOrgan
    inverse: true
    reattaching: true
  - type: SurgeryGenitalConsentCondition
  - type: GenitalSurgery

