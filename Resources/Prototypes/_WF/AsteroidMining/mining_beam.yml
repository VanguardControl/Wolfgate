# A heavy energy ship gun in the family of the M25 and Apollo. The gunnery console aims and fires it; its pulses heat
# asteroids instead of damaging them, at the power set in the console's mining laser panel.
- type: entity
  id: WFWeaponTurretMiningBeam
  name: M40 Prospector mining laser
  parent:
  - BallisticArtillery
  - BallisticArtilleryTier2HP
  - ConstructibleMachine
  description: A focused mining laser with a spinning emitter fork. Hold it on an asteroid to heat the rock until it cracks; the gunnery console shows the rock's heat and sets the laser's power. Strong enough to overcharge most rocks at full power. It barely scratches anything else.
  components:
  - type: StaticPrice
    price: 6000
  - type: Sprite
    sprite: _WF/AsteroidMining/Structures/mining_beam.rsi
    layers:
    - state: space_artillery
      map: [ "enum.WFMiningBeamVisualLayers.Base" ]
  - type: Appearance
  - type: AmmoCounter
  - type: Battery
    maxCharge: 3000
    startingCharge: 3000
  - type: ExaminableBattery
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 300
  - type: WirelessNetworkConnection
    range: 500
  - type: FireControlRotate
  - type: Gun
    fireRate: 10
    recoil: 0
    minAngle: 0
    maxAngle: 0
    shootThermalSignature: 20000
    soundGunshot: null
    soundEmpty:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
  - type: SpaceArtillery
    powerChargeRate: 300
    powerUsePassive: 500
    powerUseActive: 0
  - type: Actions
  - type: HitscanBatteryAmmoProvider
    proto: WFMiningBeamPulse
    fireCost: 25
  - type: Machine
    board: WFWeaponTurretMiningBeamCircuitboard
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.75,-0.75,0.75,0.75"
        density: 1500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: RadarBlip
    radarColor: "#ffb347"
    scale: 1.5
    visibleFromOtherGrids: true
    gridConfig:
      color: "#ffb347"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-1,-1,1,1"
  - type: ShipGunType
    shipType: Energy
  - type: ShipGunClass
    shipClass: Light
  - type: ShipRepairable
    repairTime: 15
    repairCost: 40
  - type: HardpointAnchorableOnly
    class: Energy
    size: Heavy
  - type: WFMiningBeamEmitter
    crackRate: 1.6

# One pulse of the mining laser. It draws no flash of its own; the beam overlay draws the laser.
- type: entity
  id: WFMiningBeamPulse
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanAmmo
  - type: HitscanBasicRaycast
    maxDistance: 60
  - type: HitscanRadarSignature
    radarColor: "#ffb347"
  # Enough to break tile rock through gathering; asteroids and boulders it heats are taken out of the hit list first.
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 1
        Structural: 1
  - type: HitscanGathering
  - type: WFMiningPulse

- type: entity
  id: WFWeaponTurretMiningBeamCircuitboard
  parent: BaseMachineCircuitboard
  name: M40 Prospector mining laser machine board
  description: A machine printed circuit board for an M40 Prospector mining laser.
  suffix: Machine Board
  components:
  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: WFWeaponTurretMiningBeam
    requirements:
      MatterBin: 2
      Manipulator: 4
    stackRequirements:
      Steel: 10
      Plasma: 5
      CableHV: 2
    tagRequirements:
      MicroprocessorEconomy1:
        amount: 2
        defaultPrototype: MicroprocessorEconomy1
      MotorEconomy1:
        amount: 1
        defaultPrototype: MotorEconomy1

- type: latheRecipe
  parent: BaseGoldCircuitboardRecipe
  id: WFWeaponTurretMiningBeamCircuitboard
  result: WFWeaponTurretMiningBeamCircuitboard
  completetime: 8
  materials:
    Steel: 1500
    Plasteel: 600
    Glass: 1000
    Gold: 500
    Silver: 400
    Plasma: 800

# The light sibling for light energy hardpoints: 40 m reach, about half the heat and crack speed. It cracks plain rock
# at high power but needs a second laser for tough metallic rock.
- type: entity
  id: WFWeaponTurretMiningLaserSmall
  name: M12 Prospector mining laser
  parent:
  - BallisticArtillery
  - BallisticArtilleryTier1HP
  - ConstructibleMachine
  description: A compact mining laser for light hardpoints. It heats asteroids more gently and cracks them more slowly than the M40, and tough rocks need two of them. The gunnery console shows the rock's heat and sets the laser's power.
  components:
  - type: StaticPrice
    price: 2000
  - type: Sprite
    sprite: _WF/AsteroidMining/Structures/mining_laser_small.rsi
    layers:
    - state: space_artillery
      map: [ "enum.WFMiningBeamVisualLayers.Base" ]
  - type: Appearance
  - type: AmmoCounter
  - type: Battery
    maxCharge: 1500
    startingCharge: 1500
  - type: ExaminableBattery
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 150
  - type: WirelessNetworkConnection
    range: 500
  - type: FireControlRotate
  - type: Gun
    fireRate: 10
    recoil: 0
    minAngle: 0
    maxAngle: 0
    shootThermalSignature: 8000
    soundGunshot: null
    soundEmpty:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
  - type: SpaceArtillery
    powerChargeRate: 150
    powerUsePassive: 250
    powerUseActive: 0
  - type: Actions
  - type: HitscanBatteryAmmoProvider
    proto: WFMiningBeamPulseSmall
    fireCost: 12
  - type: Machine
    board: WFWeaponTurretMiningLaserSmallCircuitboard
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 800
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: RadarBlip
    radarColor: "#ffb347"
    scale: 1
    visibleFromOtherGrids: true
    gridConfig:
      color: "#ffb347"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-0.6,-0.6,0.6,0.6"
  - type: ShipGunType
    shipType: Energy
  - type: ShipGunClass
    shipClass: Superlight
  - type: ShipRepairable
    repairTime: 10
    repairCost: 20
  - type: HardpointAnchorableOnly
    class: Energy
    size: Light
  - type: WFMiningBeamEmitter
    maxRange: 40
    strength: 0.6
    crackRate: 0.6
    beamWidth: 0.55
    muzzleOffset: 0, -0.34

- type: entity
  parent: WFMiningBeamPulse
  id: WFMiningBeamPulseSmall
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicRaycast
    maxDistance: 40

- type: entity
  id: WFWeaponTurretMiningLaserSmallCircuitboard
  parent: BaseMachineCircuitboard
  name: M12 Prospector mining laser machine board
  description: A machine printed circuit board for an M12 Prospector mining laser.
  suffix: Machine Board
  components:
  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: WFWeaponTurretMiningLaserSmall
    requirements:
      MatterBin: 1
      Manipulator: 2
    stackRequirements:
      Steel: 5
      Plasma: 2
      CableHV: 1
    tagRequirements:
      MicroprocessorEconomy1:
        amount: 1
        defaultPrototype: MicroprocessorEconomy1

- type: latheRecipe
  parent: BaseCircuitboardRecipe
  id: WFWeaponTurretMiningLaserSmallCircuitboard
