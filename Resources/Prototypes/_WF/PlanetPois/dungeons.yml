# Site interiors: Frontier's planet-base dungeons, each with a few mobs and some loot, since the bare configs have none.

- type: dungeonConfig
  id: WFPoiExperiment
  layers:
  - !type:PrototypeDunGen
    proto: NFExperiment
  - !type:EntityTableDunGen
    minCount: 4
    maxCount: 8
    table: !type:NestedSelector
      tableId: SalvageEquipmentSpawnerCommon
  - !type:MobsDunGen
    minCount: 3
    maxCount: 6
    groups:
    - id: MobArgocyteSlurvaExpeditions
      amount: 1

- type: dungeonConfig
  id: WFPoiHaunted
  layers:
  - !type:PrototypeDunGen
    proto: NFHaunted
  - !type:EntityTableDunGen
    minCount: 3
    maxCount: 6
    table: !type:NestedSelector
      tableId: SalvageTreasureSpawnerValuable
  - !type:MobsDunGen
    minCount: 3
    maxCount: 6
    groups:
    - id: MobArgocyteCrawlerExpeditions
      amount: 1

- type: dungeonConfig
  id: WFPoiMineshaft
  # A key the Frontier config leaves out, which its corridor layer logs an error about.
  data:
    colors:
      Decals: "#6b5a3eff"
  layers:
  - !type:PrototypeDunGen
    proto: NFMineshaft
  - !type:EntityTableDunGen
