# Site interiors: Frontier's planet-base dungeons dressed for the world they stand on (its rock for the corridor
# walls, its ground for the corridor floor, a decal tint to match), with a few of the world's mobs and some loot,
# since the bare configs have neither. The mobs are the plain argocytes: the Expeditions ones despawn off a salvage map.

# Asclepiu: temperate, overgrown
- type: dungeonConfig
  id: WFPoiAsclepiuResearch
  data:
    colors:
      Decals: "#4f7a3aff"
    entities:
      Walls: WallSolidRust
      CornerWalls: WallSolidRust
    tiles:
      FallbackTile: FloorDirt
  layers:
  - !type:PrototypeDunGen
    proto: NFExperiment
  - !type:EntityTableDunGen
    minCount: 4
    maxCount: 8
    table: !type:NestedSelector
      tableId: SalvageEquipmentSpawnerCommon
  - !type:MobsDunGen
    minCount: 3
    maxCount: 6
    groups:
    - id: MobArgocyteSlurva
      amount: 1

