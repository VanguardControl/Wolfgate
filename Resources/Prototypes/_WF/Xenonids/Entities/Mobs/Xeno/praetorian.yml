- type: entity
  abstract: true
  parent:
  - CMXenoDeveloped
  - CMXenoTail
  - CMXenoFlammable
  - RMCXenoSpeechSounds
  # WOLFGATE: cut parent RMCXenoCommendationReceiver
  - RMCXenoMobCollision
  id: CMXenoPraetorianBase
  name: Praetorian
  description: A huge, looming beast of an alien.
  components:
  - type: Sprite
    sprite: _WF/Xenonids/Mobs/Xenonids/Praetorian/praetorian.rsi
  - type: MobState
    allowedStates:
    - Alive
    - Critical
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      650: Critical
      750: Dead
  - type: Xeno
    role: CMXenoPraetorian
    actionIds:
    - ActionXenoRest
    - ActionXenoRegurgitate
    - ActionXenoWatch
    - ActionXenoTailStab
    - ActionXenoAcidNormal
    - ActionXenoSpitPraetorian
    # XENOPORT(P3-M): - ActionXenoDash
    - ActionXenoAcidBall
    # XENOPORT(P3-B): - ActionXenoSprayAcidPraetorian
    - ActionXenoDevolve
    tier: 3
    hudOffset: -0.15,0.16
    unlockAt: 900 # 15 minutes
  - type: XenoHeavy
  - type: XenoDevolve
    # XENOPORT(P3-M): CMXenoWarrior; XENOPORT(P3-B): CMXenoSpitter; restore the list below when the castes land
    devolvesTo: []
    # - CMXenoWarrior
    # - CMXenoSpitter
  - type: XenoAcid
  - type: XenoDevour
  - type: XenoPlasma
    plasma: 800
    maxPlasma: 800
    plasmaRegenOnWeeds: 3
  - type: CMArmor
    xenoArmor: 25
    explosionArmor: 40
  - type: MeleeWeapon
    damage:
      groups:
        Brute: 40
  - type: XenoTailStab
    tailDamage:
      groups:
        Brute: 48
  - type: Tackle
    chance: 0.45
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 185
        # WOLFGATE: no BarricadeImpassable or BarbedBarricade layers here
        mask:
        - MobMask
        layer:
        - MobLayer
      fix2:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 185
        layer:
        - BulletImpassable
  - type: RMCSize
    size: Big
  - type: RMCXenoDamageVisuals
    prefix: praetorian
  - type: XenoSpit
    projectileId: XenoSpitProjectilePraetorian
  # XENOPORT(P3-B): XenoSprayAcid
  # - type: XenoSprayAcid
  #   barricadeDamage:
  #     types:
  #       Heat: 5
  #   range: 7
  # WOLFGATE: cut TacticalMapIcon (tactical map)
  - type: SlowOnPull
    # WOLFGATE: humanoids stand in for marines
    slowdowns:
    - multiplier: 0.5875
      whitelist:
        components:
        - HumanoidAppearance
    - multiplier: 0.645
      whitelist:
        components:
        - XenoLight
    - multiplier: 0.4275
      whitelist:
        components:
        - XenoHeavy
  # WOLFGATE: cut IntelRecoverCorpseObjectiveOnDeath (intel)
  - type: FixedIdentity
    name: cm-job-name-xeno-praetorian
  # WOLFGATE: cut RMCSurgeryXenoHeart (RMC medical)

- type: entity
  parent: CMXenoPraetorianBase
  id: CMXenoPraetorian
  components:
  # WOLFGATE: cut GuideHelp (RMC guidebook pages are not ported)
  # XENOPORT(P3-B): XenoSprayAcid
  # - type: XenoSprayAcid
  #   barricadeDamage:
  #     types:
  #       Heat: 5
  #   acid: XenoAcidSprayAcidStacks
  #   plasmaCost: 80
  - type: XenoLeap
    plasmaCost: 40
    delay: 0
    knockdownTime: 0
    range: 6
    moveDelayTime: 0
  - type: XenoShield
    shield: Praetorian
  - type: XenoAcidBall
  - type: XenoEvolution
    strains:
    - RMCXenoPraetorianDancer
    - RMCXenoPraetorianOppressor
    - RMCXenoPraetorianVanguard
    - RMCXenoPraetorianValkyrie
  - type: AcidTrap
  # WOLFGATE: cut RMCActionOrder

- type: entity
  parent: CMXenoPraetorianBase
  id: RMCXenoPraetorianValkyrie
  suffix: Valkyrie
  components:
  # WOLFGATE: cut GuideHelp (RMC guidebook pages are not ported)
  - type: Sprite
    sprite: _WF/Xenonids/Mobs/Xenonids/Praetorian/valkyrie_praetorian.rsi
  - type: Xeno
    actionIds:
    - ActionXenoRest
    - ActionXenoRegurgitate
    - ActionXenoWatch
    - ActionXenoTailFountain
    - ActionXenoAcidNormal
    - ActionXenoPheromones
    # XENOPORT(P3-M): - ActionXenoTantrum
    - ActionXenoHighGallop
    - ActionXenoFightOrFlight
    - ActionXenoRetrieve
    - ActionXenoDevolve
  - type: XenoStrain
    name: rmc-xeno-valkyrie-name
    description: rmc-xeno-valkyrie-description
    popup: rmc-xeno-valkyrie-popup
  - type: XenoPheromones
    pheromonesMultiplier: 3
    pheroSuffix: strong
  - type: XenoEnergy
    alert: XenoEnergyValkyrie
    popupGain: rmc-xeno-fury-increase-user
    popupNotEnough: rmc-xeno-not-enough-fury
    max: 200
    gainAttack: 15
    gainAttackDowned: 15
  - type: XenoRetrieve
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.2
    baseSprintSpeed: 3.5
  - type: SlowOnPull
    # WOLFGATE: humanoids stand in for marines
    slowdowns:
    - multiplier: 0.64
      whitelist:
        components:
        - HumanoidAppearance
    - multiplier: 0.7025
      whitelist:
        components:
        - XenoLight
    - multiplier: 0.475
      whitelist:
        components:
        - XenoHeavy
  - type: CMArmor
    xenoArmor: 35
  - type: XenoClaws
    clawType: VerySharp
  - type: XenoTailFountain
  # XENOPORT(P3-M): XenoTantrum
  # - type: XenoTantrum
  - type: XenoFury
  - type: XenoFightOrFlight
    componentsRemove:
    - type: RMCSlowdown
    - type: RMCSuperSlowdown
    - type: RMCRooted
  - type: XenoHighGallop
  - type: XenoHidden
  - type: AcidTrap
  # WOLFGATE: cut RMCActionOrder

