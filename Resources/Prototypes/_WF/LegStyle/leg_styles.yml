# Legs a species can pick instead of its own, from the Digitigrade legs toggle in the character editor.
# A species listed under a style stands the other way by default. displacementSlots are the clothing slots
# the legs reshape: they use the style's maps (or none) instead of the species' own, and a female body uses
# femaleDisplacements where it has the slot. The art and the maps under _WF/LegStyle are made by
# Tools/_WF/LegStyle/port.py; the plain jumpsuit map is the one Reptilians use.

# Digitigrade legs for species that stand flat.

- type: wfLegStyle
  id: WFLegsHumanDigitigrade
  species: [ Human, Dwarf, Felinid, Oni ]
  stance: Digitigrade
  sprites:
    LLeg: WFMobHumanLLegDigi
    RLeg: WFMobHumanRLegDigi
    LFoot: WFMobHumanLFootDigi
    RFoot: WFMobHumanRFootDigi
  displacementSlots: [ jumpsuit, shoes ]
  displacements:
    jumpsuit: &digitigradeJumpsuit
      sizeMaps:
        32:
          sprite: _White/Mobs/Species/displacement.rsi
          state: jumpsuit
    shoes: &humanPawShoes
      sizeMaps:
        32:
          sprite: _WF/LegStyle/displacement.rsi
          state: shoes_human
  femaleDisplacements:
    # The human chest fit above the hip.
    jumpsuit: &digitigradeJumpsuitFemale
      sizeMaps:
        32:
          sprite: _WF/LegStyle/displacement.rsi
          state: jumpsuit_female

