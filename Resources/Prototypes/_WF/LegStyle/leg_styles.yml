# Legs a species can pick instead of its own, from the Digitigrade legs toggle in the character editor.
# A species listed under a style stands the other way by default. displacementSlots are the clothing slots
# the legs reshape: they use the style's maps (or none) instead of the species' own. The shoe maps are made for
# each set of legs by Tools/_WF/LegStyle/port.py; the jumpsuit maps are the ones Reptilians use.

- type: wfLegStyle
  id: WFLegsHumanDigitigrade
  species: [ Human, Dwarf, Felinid, Oni ]
  stance: Digitigrade
  sprites:
    LLeg: WFMobHumanLLegDigi
    RLeg: WFMobHumanRLegDigi
    LFoot: WFMobHumanLFootDigi
    RFoot: WFMobHumanRFootDigi
  displacementSlots: [ jumpsuit, shoes ]
  displacements:
    jumpsuit:
      sizeMaps:
        32:
          sprite: _White/Mobs/Species/displacement.rsi
          state: jumpsuit
    shoes:
      sizeMaps:
        32:
          sprite: _WF/LegStyle/displacement.rsi
          state: shoes_human
  femaleDisplacements:
    jumpsuit:
      sizeMaps:
        32:
          sprite: _White/Mobs/Species/displacement.rsi
          state: jumpsuit-female
    shoes:
      sizeMaps:
        32:
          sprite: _WF/LegStyle/displacement.rsi
          state: shoes_human

