# Ported from HardLight
- type: entity
  name: avali auto-injector
  parent: NFChemicalMedipen
  id: AvaliAutoInjector
  description: A rapid dose of stabilizing chemical agents designed to save Avali lives. Contains amoxla and tranexamic acid.
  components:
  - type: Sprite
    sprite: _WF/Species/Objects/Specific/Medical/avalipen.rsi
    layers:
    - state: avalipen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    emptySpriteName: avalipen_empty
  - type: Hypospray
    transferAmount: 20
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 20
        reagents:
        - ReagentId: Amoxla
          Quantity: 15
        - ReagentId: TranexamicAcid
          Quantity: 5
