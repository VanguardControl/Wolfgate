# WOLFGATE (WP7 -> P5-1): Onyx's Ipc/Slime/Plant/Cybernetic profiles and their wound sets were dropped
# for phase 1 (D3) and restored verbatim in phase 5 (14 of 30 -> 30 of 30). Only two classes of marked
# fold exist below: D9 (Chest+Groin -> Torso) and DECISIONS Sec 8.2-1 (manipulationModifier inversion,
# CyberneticFractureProfile).
- type: bodyPartProfile
  id: OrganicBodyPartProfile
  treatmentCapabilities: [Biological]
  bleedingMultiplier: 1.0
  acceptedDamageTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Cold
    - Shock
    - Caustic # WOLFGATE: D20 reversed - OrganicPart supports the whole Burn group, which includes Caustic
  supportedWounds:
    - BluntWound
    - SlashWound
    - PiercingWound
    - BurnWound
    - ElectricalWound
    - BoneFractureWound
    - SurgicalIncisionWound
    - DismembermentWound
    - AmputationConsequenceWound
    - InternalBleedingWound
    - MedicalScarWound
    - SystemicBleedingWound
    # WOLFGATE (W1): ballistic wounds, created only by wolfmedWoundRule (see _WF/Wolfmed/Wounds).
    - WolfmedGrazeWound
    - WolfmedGunshotWound
    - WolfmedLodgedRoundWound
    - WolfmedShrapnelWound
    # WOLFGATE (W2): slash and bite wounds, also created only by wolfmedWoundRule.
    - WolfmedArterialBleedWound
    - WolfmedTendonCutWound
    - WolfmedAvulsionWound
    # WOLFGATE (W3): blunt trauma wounds, also created only by wolfmedWoundRule.
    - WolfmedCrushInjuryWound
    - WolfmedConcussionWound
    - WolfmedDislocationWound
    - WolfmedOrganContusionWound
    # WOLFGATE (W4): burn wounds. Charring comes from WolfmedCharringSystem, the other three from rules.
    - WolfmedCharringWound
    - WolfmedFrostbiteWound
    - WolfmedChemicalBurnWound
    - WolfmedInternalBurnWound
    # WOLFGATE (W5): dead tissue, left by WolfmedNecrosisSystem rather than by a hit.
    - WolfmedNecrosisWound
  organDamage:
    chances:
      Head: 0.05
      # WOLFGATE (D9): Onyx's Chest 0.04 and Groin 0.04 fold into Torso 0.04 (not summed - independent per-part rolls, one torso).
      Torso: 0.04
      Arm: 0.02
      Hand: 0.01
      Leg: 0.02
      Foot: 0.01
    maxAffected: 2

- type: bodyPartProfile
  id: IpcBodyPartProfile
  treatmentCapabilities: [Mechanical, Electrical]
  passiveRecoveryMultiplier: 0
  bedRecoveryMultiplier: 0
  bleedingMultiplier: 1
  scarrable: false
  acceptedDamageTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Cold    # WOLFGATE (P5-1/P5-D20): inert unless U13'(b) ships - PartIPCBase's Inorganic container
    - Shock   #   (Brute + Heat/Shock) supports neither Cold nor Caustic. Onyx's SiliconIpc does.
    - Caustic # WOLFGATE (P5-1/P5-D20): as above. Kept so the profile stays a verbatim Onyx copy.
  supportedWounds:
    - IpcMechanicalDamageWound
    - ElectricalWound
    - SurgicalIncisionWound
    - DismembermentWound
    - AmputationConsequenceWound
    - SystemicBleedingWound
    # WOLFGATE (W6): mechanical wounds, created only by wolfmedWoundRule (see _WF/Wolfmed/Wounds). None of
    # them appears in OrganicBodyPartProfile, and none of that profile's Wolfmed wounds appears here.
    - WolfmedDentWound
    - WolfmedBreachWound
    - WolfmedShortCircuitWound
    - WolfmedServoDamageWound
    - WolfmedOverheatingWound
  organDamage:
    # WOLFGATE (P5-1/P5-D13): inert until IPC organs carry OrganDamage (Sec 8.6-7 keeps organ damage
    # human-lineage only). Do NOT add maxAffected - Onyx sets it only on OrganicBodyPartProfile.
    chances:
      Head: 0.05
      # WOLFGATE (D9): Onyx's Chest 0.04 and Groin 0.04 fold into Torso 0.04 (not summed - independent
      # per-part rolls, and Wolfgate has one torso).
      Torso: 0.04
      Arm: 0.02
      Hand: 0.01
      Leg: 0.02
      Foot: 0.01

- type: bodyPartProfile
  id: SlimeBodyPartProfile
  treatmentCapabilities: [Biological]
  bleedingMultiplier: 1.15
  scarrable: false
  acceptedDamageTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Cold
    - Shock
    - Caustic
  supportedWounds:
    - SlimeBluntWound
    - SlimeSlashWound
    - SlimePiercingWound
    - SlimeBurnWound
    - ElectricalWound
    - SurgicalIncisionWound
    - DismembermentWound
    - AmputationConsequenceWound
    - InternalBleedingWound
    - SystemicBleedingWound
  organDamage:
    # WOLFGATE (P5-1/P5-D13): inert - see IpcBodyPartProfile above. Do NOT add maxAffected or limb rows -
    # Onyx lists only Head/Chest/Groin here.
    chances:
      Head: 0.05
      # WOLFGATE (D9): Chest 0.04 + Groin 0.04 -> Torso 0.04 (see IpcBodyPartProfile above).
      Torso: 0.04

- type: bodyPartProfile
  id: CyberneticBodyPartProfile
  treatmentCapabilities: [Mechanical, Electrical]
  canFeelPain: false
  passiveRecoveryMultiplier: 0
  bedRecoveryMultiplier: 0
  bleedingMultiplier: 0.5
  scarrable: false
  acceptedDamageTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Cold    # WOLFGATE (P5-1/P5-D20): inert unless U13'(b) ships - see IpcBodyPartProfile above.
    - Shock
    - Caustic # WOLFGATE (P5-1/P5-D20): as above.
  supportedWounds:
    - CyberneticMechanicalDamageWound
    - ElectricalWound
    - CyberneticFrameFractureWound
    - SurgicalIncisionWound
    - DismembermentWound
    - AmputationConsequenceWound
    # WOLFGATE (W6): as on IpcBodyPartProfile above - a cybernetic limb dents, breaches, shorts, loses a
    # servo and overheats exactly as an IPC chassis does.
    - WolfmedDentWound
    - WolfmedBreachWound
    - WolfmedShortCircuitWound
    - WolfmedServoDamageWound
    - WolfmedOverheatingWound
  # WOLFGATE: no organDamage block on Onyx's original either - nothing to fold.

