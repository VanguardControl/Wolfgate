        rate: 0.15
        minimumSeverity: 9
    Severe:
      name: wound-stage-severe
      severity: 50
      behaviors:
      - !type:WoundFunctionalityBehavior
        state: Impaired
      - !type:WoundBleedingBehavior
        rate: 0.2
        minimumSeverity: 9
    Critical:
