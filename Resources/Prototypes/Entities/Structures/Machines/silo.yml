- type: entity
  id: MachineMaterialSilo
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: material silo
  description: An advanced machine, capable of using bluespace technology to transmit materials to nearby machines.
  components:
  - type: Sprite
    sprite: Structures/Machines/silo.rsi
    snapCardinals: true
    layers:
    - state: silo
      map: [ "base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        base:
          True: { state: silo_active }
          False: { state: silo }
  - type: OreSilo
    range: 125 # Mono
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
      - Ore
  - type: AutomationSlots # Goobstation
    slots:
    - !type:AutomatedMaterialStorage
      input: AutomationSlotMaterials
      output: null
  - type: ActivatableUI
    key: enum.OreSiloUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.OreSiloUiKey.Key:
        type: OreSiloBoundUserInterface
  - type: Machine
    board: MaterialSiloMachineCircuitboard
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: WiresVisuals
  - type: WiresPanel
  - type: StaticPrice
    price: 1500
  - type: MaterialStorageMagnetPickup # Mono
    range: 2

- type: entity
  id: BaseFabricationSilo
  abstract: true
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: fabrication silo
  components:
  - type: Sprite
    sprite: Structures/Machines/silo.rsi
    snapCardinals: true
    layers:
    - state: silo
      map: [ "base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        base:
          True: { state: silo_active }
          False: { state: silo }
  - type: FabricationSilo
    range: 125
  - type: ContainerContainer
    containers:
      fabrication_parts: !type:Container
  - type: ActivatableUI
    key: enum.FabricationSiloUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.FabricationSiloUiKey.Key:
        type: FabricationSiloBoundUserInterface
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask: [MachineMask]
        layer: [MachineLayer]
  - type: WiresVisuals
  - type: WiresPanel
  - type: StaticPrice
    price: 1500

- type: entity
  id: MachinePartsSilo
  parent: BaseFabricationSilo
  name: parts silo
  description: Stores precursor components and supplies them to linked fabrication machines. Use a component on it to deposit it.
  components:
  - type: FabricationSilo
    kind: Parts
  - type: Machine
    board: PartsSiloMachineCircuitboard

- type: entity
  id: MachineChemicalSilo
  parent: BaseFabricationSilo
  name: chemical silo
  description: Stores chemicals used in fabrication recipes separately and supplies them to linked machines. Use a beaker or jerry can on it to deposit accepted chemicals.
  components:
  - type: FabricationSilo
    kind: Chemicals
  - type: Machine
    board: ChemicalSiloMachineCircuitboard
