- type: entity
  id: MobIPC
  parent: PlayerSiliconHumanoidBase
  name: Urist McPositronic
  description: A positronic brain in a metal body.
  components:
  # WOLFGATE (P5-1/P5-2, PROTO Q): IPCs become wound hosts. Onyx does the same on its own MobIpc
  # (ONYX Resources/Prototypes/Corvax/Body/Species/ipc.yml:92-113).
  - type: WoundHost
  # WOLFGATE (P5-D10/U1): Onyx puts PainShockTarget on BaseSpeciesMob (ONYX Body/species_base.yml:54),
  # which its MobIpc parents - Onyx IPCs DO get pain shock. Wolfgate put it on BaseMobSpeciesOrganic
  # (P2-D7, Entities/Mobs/Species/base.yml:256), which MobIPC does not inherit, so it is restated here.
  # IpcBodyPartProfile leaves canFeelPain at its default (true). EmoteOnDamage is deliberately NOT added:
  # Onyx's copy uses the broken `emotes:` key (DECISIONS 8.2-3) and MobIpc's allowedEmotes are Boop/Whirr.
  - type: PainShockTarget
  # WOLFGATE (P5-2/P5-D4/U16): Onyx's bloodReferenceSolution (Oil 250) maps onto Wolfgate's classic
  # bloodReagent + bloodMaxVolume; WG's BloodstreamComponent has no bloodReferenceSolution field.
  # Wound bleeding writes BleedAmount through BloodstreamSystem.TryModifyWoundBleedProjection (GUARD E3)
  # and TryModifyBloodLevel spills BloodReagent - so an IPC leaks oil, not blood. SolutionContainerManager
  # is not declared: BloodstreamSystem's EnsureSolution EnsureComp's it. No circulatoryStream:
  # IpcBodyPartProfile stays on the primary Organic stream, exactly as Onyx's does (P5-D3).
  # chemicalMaxVolume: 0 (U16) because an IPC has no metabolizer - OrganIPCPump's Metabolizer block is
  # commented out (_EinsteinEngines/Body/Organs/ipc.yml) - so a 250u chemical solution would be a trap.
  # InjectableSolution is deliberately NOT added; Onyx gets it by parenting MobBloodstream
  # (Entities/Mobs/base.yml), Wolfgate does not, and nothing can metabolise what is injected.
  # bloodlossDamage uses Bloodloss, never Heat (P5-D6): Heat is in WoundHostComponent.LocalizedDamageTypes,
  # so it would be routed to a part, create IpcMechanicalDamageWound severity and bleed at chance 1 - a
  # self-reinforcing leak loop. Bloodloss stays systemic and self-limits via bloodlossHealDamage.
  - type: Bloodstream
    bloodReagent: Oil
    bloodMaxVolume: 250
    chemicalMaxVolume: 0
    bloodlossDamage:
      types:
        Bloodloss: 0.5
    bloodlossHealDamage:
      types:
        Bloodloss: -1
  # WOLFGATE (P5-D5/P5-D5b): Silicon + the Bloodloss TYPE (not the Airloss group) so oil loss and phase 3's
  # P3-D1 vital-part Bloodloss charge actually land - the stock Silicon container has no Bloodloss and
  # DamageableSystem silently drops unsupported types (DamageableSystem.cs:270-277). PROTO S/T added
  # SiliconWolfmed to the welder and nanite applicator in WP13-1, so repair keeps working
  # (WeldingHealableSystem.cs:33-35). damageModifierSet is inherited per key from
  # PlayerSiliconHumanoidBase:26-28 (component data merges field by field); restated here only so the pair
  # is readable in one place.
  - type: Damageable
    damageContainer: SiliconWolfmed
    damageModifierSet: IPC
  - type: LanguageKnowledge # Einstein Engines - Languages
    speaks:
    - TauCetiBasic
    - RobotTalk
    understands:
    - TauCetiBasic
    - RobotTalk
  - type: HarpySinger
  - type: Instrument
    allowPercussion: true
    allowProgramChange: true
    program: 52
  - type: SwappableInstrument
    instrumentList:
      "Daw": { 0: 0 }
  - type: UserInterface
    interfaces:
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
      enum.VoiceMaskUIKey.Key:
        type: VoiceMaskBoundUserInterface
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      enum.SurgeryUIKey.Key: # Shitmed
        type: SurgeryBui
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: true
  - type: ItemSlots
    slots:
      cell_slot:
        locked: true
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: BatterySlotRequiresLock
    itemSlot: cell_slot
  - type: EncryptionHolderRequiresLock
  - type: SiliconEmitSoundOnDrained
    sound: "/Audio/_Goobstation/Voice/IPC/energy_low.ogg" # Goobstation - ipc audio
    minInterval: 8
    maxInterval: 12
    popUp: "silicon-power-low"
  - type: Lock
    locked: true
    lockOnClick: false
    unlockOnClick: false
    lockTime: 5
    unlockTime: 5
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: hugging-success-generic
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-generic-others
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: StandingState
  - type: MobState
    allowedStates:
    - Alive
    - Dead # why did EE just not remove the state and instead made them crit at 119.999???
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead # mono
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
  - type: TypingIndicator
    proto: robot
  # WOLFGATE (D22/P5-D11): body damage on a wound host is the sum of every part's positive damage
  # (WoundDamageProjectionSystem.RefreshBodyDamage:156-201), so the old flat Blunt 400 below is reachable
  # from routine limb damage on a corpse - the same reason BaseMobSpeciesOrganic was raised to 1500
  # (Entities/Mobs/Species/base.yml:270-278). 400 -> 1500. MobThresholds is NOT touched: death stays at a
  # projected total of 100.
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 1500
      behaviors:
      - !type:GibBehavior { }
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      90: 0.5
      120: 0.3
  - type: SiliconDownOnDead
  - type: Inventory
    templateId: ipc
  - type: GuideHelp
    guides:
    - IPC
  - type: Silicon
    entityType: enum.SiliconType.Player
    batteryPowered: true
    drainPerSecond: 0.65 # 1.5 -> 0.65 - Mono
    chargeThresholdMid: 0.80
    chargeThresholdLow: 0.35
    chargeThresholdCritical: 0.10
    speedModifierThresholds:
      4: 1
      3: 1
      2: 0.80
      1: 0.45
      0: 0.00
  - type: BatteryDrinker
  - type: EncryptionKeyHolder
    keySlots: 8 # Mono
    examineWhileLocked: false
    keysExtractionMethod: Cutting
    keysUnlocked: false
  - type: ActiveRadio
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
  - type: DeadStartupButton
    sound:
      path: /Audio/_EinsteinEngines/Effects/Silicon/startup.ogg
  # Erro de linter
  #   - type: Wires
  #     layoutId: IPC
  - type: EmitBuzzWhileDamaged
  - type: CanHostGuardian
  - type: WeldingHealable
  - type: RetroMonitorView # Mono

- type: entity
  save: false
  name: Urist McPositronic
  parent: MobHumanDummy
  id: MobIPCDummy
  categories: [ HideSpawnMenu ] # Goobstation
  description: A dummy IPC meant to be used in character setup.
  components:
  - type: HumanoidAppearance
    species: IPC
  - type: Inventory
    templateId: ipc
