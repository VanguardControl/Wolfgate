- type: job
  id: Godfather
  name: job-name-godfather
  description: job-description-godfather
  playTimeTracker: JobGodfather
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 54000 # 15 hours # mono
  - !type:RoleTimeRequirement
    role: JobFugitive
    time: 18000 # 5 hours
  # WOLFGATE(Underground) START: the job no longer rolls for a heretic mark, so the trait is open to it
  # - !type:TraitsRequirement # already a heretic by default
  #   inverted: true
  #   traits:
  #   - Heretic
  # WOLFGATE END
  alternateRequirementSets:
    longerPlaytimeLessFugitive:
    - !type:OverallPlaytimeRequirement
      time: 216000 # 60 hours
    # WOLFGATE(Underground) START: the job no longer rolls for a heretic mark, so the trait is open to it
    # - !type:TraitsRequirement # already a heretic by default
    #   inverted: true
    #   traits:
    #   - Heretic
    # WOLFGATE END
  whitelisted: true # I am NOT trusting regular players to not just use this role to frag out.
  startingGear: GodfatherGear
  icon: JobIconGodfather
  alwaysUseSpawner: true
  supervisors: job-supervisors-nobody
  # WOLFGATE(ReaverCampaign): Underground crew fly the neutral WGUnderground company, so the Reavers leave them alone
  assignedCompany: WGUnderground
  displayWeight: 150
  accessGroups:
  - GeneralAccess
  access: 
  - Underground
  - Godfather
  guides:
  - Underground
  special:
  - !type:GiveItemOnHolidaySpecial
    holiday: FrontierBirthday
    prototype: FrontierBirthdayGift
  - !type:AddComponentSpecial
    components:
    # WOLFGATE(ReaverCampaign) START: Underground people are allied with the Reaver campaign's crews
    - type: NpcFactionMember
      factions:
      - NanoTrasen
      - WGUnderground
    # WOLFGATE END
    # WOLFGATE(Underground) START: the warrant is kept by the Underground module and grows with the member's jobs; was a fixed 400
    # - type: Contraband
    #   hideValues: true
    #   turnInValues:
    #     FederationMilitaryCredit: 400 # bounty on your head
    - type: WGUndergroundMember
      baseWarrant: 100
      maxWarrant: 400
    # WOLFGATE END
    - type: RadioOnCryosleep
      radioChannel: Syndicate # Syndicate = Underground
    # WOLFGATE(Underground) START: no automatic heretic mark; the Heretic trait is how a member gets one
    # - type: AddComponentsAfterTime # heresy
    #   addComponentsOnSelection:
    #   - type: Contraband
    #     hideValues: true
    #     turnInValues:
    #       FederationMilitaryCredit: 400
    #       Doubloon: 250
    #   - type: Heretic
    # WOLFGATE END
  - !type:AddImplantSpecial
    implants: [ DeathRattleImplant, RadioImplant ]
  - !type:AddLanguageSpecial
    languagesSpoken:
    - UndergroundCodespeak
    languagesUnderstood:
    - UndergroundCodespeak

- type: startingGear
  id: GodfatherGear
  equipment:
    pocket1: WeaponPistolDamocles
    pocket2: EnergySword
  storage:
    back:
    - Telecrystal50 # 50 TC
    - Magazine9x19mmPistolHighCapacityFMJ
    - Magazine9x19mmPistolHighCapacityFMJ
    - ContractorIDCard
