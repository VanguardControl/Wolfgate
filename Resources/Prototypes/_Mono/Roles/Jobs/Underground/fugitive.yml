- type: job
  id: Fugitive
  name: job-name-fugitive
  description: job-description-fugitive
  playTimeTracker: JobFugitive
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 10800 # 3 hours # mono
  # WOLFGATE(Underground) START: the job no longer rolls for a heretic mark, so the trait is open to it
  # - !type:TraitsRequirement # already a heretic by default
  #   inverted: true
  #   traits:
  #   - Heretic
  # WOLFGATE END
  startingGear: FugitiveGear
  icon: JobIconFugitive
  supervisors: job-supervisors-wg-underground-godfather # WOLFGATE(Underground): fugitives answer to the Godfather; was job-supervisors-nobody
  # WOLFGATE(ReaverCampaign): Underground crew fly the neutral WGUnderground company, so the Reavers leave them alone
  assignedCompany: WGUnderground
  displayWeight: 100
  accessGroups:
  - GeneralAccess
  access:
  - Underground
  guides:
  - Underground
  special:
  - !type:GiveItemOnHolidaySpecial
    holiday: FrontierBirthday
    prototype: FrontierBirthdayGift
  - !type:AddComponentSpecial
    components:
    # WOLFGATE(ReaverCampaign) START: Underground people are allied with the Reaver campaign's crews
    - type: NpcFactionMember
      factions:
      - NanoTrasen
      - WGUnderground
    # WOLFGATE END
    # WOLFGATE(Underground) START: the warrant is kept by the Underground module and grows with the member's jobs; was a fixed 150
    # - type: Contraband
    #   hideValues: true
    #   turnInValues:
    #     FederationMilitaryCredit: 150 # bounty on your head
    - type: WGUndergroundMember
      baseWarrant: 25
      maxWarrant: 150
    # WOLFGATE END
    - type: RadioOnCryosleep
      radioChannel: Syndicate # Syndicate = Underground
    # WOLFGATE(Underground) START: no automatic heretic mark; the Heretic trait is how a member gets one
    # - type: AddComponentsAfterTime # heresy
    #   addComponentsOnSelection:
    #   - type: Contraband
    #     hideValues: true
    #     turnInValues:
    #       FederationMilitaryCredit: 150 # heresy
    #       Doubloon: 250
    #   - type: Heretic
    # WOLFGATE END
  - !type:AddImplantSpecial
    implants: [ DeathRattleImplant, RadioImplant ]
  - !type:AddLanguageSpecial
    languagesSpoken:
    - UndergroundCodespeak
    languagesUnderstood:
    - UndergroundCodespeak
  alwaysUseSpawner: true

- type: startingGear
  id: FugitiveGear
  storage:
    back:
    - Telecrystal25
    - ContractorIDCard
