# What an admin observer carries when its admin has no saved layout: a satchel of holding with one pouch per kit
# category, each holding that category's everyday tools. The pouches are the AdminTech module's subspace pouch.
- type: startingGear
  id: WGAdminObserverGear
  equipment:
    back: ClothingBackpackSatchelHolding
    id: NFAdminPDA
  storage:
    back:
    - WGAdminKitPouchEngineering
    - WGAdminKitPouchMedical
    - WGAdminKitPouchAccess
    - WGAdminKitPouchBuilding
    - WGAdminKitPouchMovement
    - WGAdminKitPouchWeapons
    - WGAdminKitPouchFun

- type: entity
  abstract: true
  parent: WGAdminTechPouch
  id: WGAdminKitPouchBase
  components:
  # One size under the satchel of holding's own limit: a bag only takes a bag that holds smaller things than it does.
  # The pouch is Large itself, as a container holds nothing bigger than itself.
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,9,5

- type: entity
  parent: WGAdminKitPouchBase
  id: WGAdminKitPouchEngineering
  components:
  - type: StorageFill
    contents:
    - id: Omnitool
    - id: ToolDebug
    - id: JawsOfLife
    - id: WelderExperimental
    - id: Multitool
    - id: GasAnalyzer
    - id: trayScanner
    - id: ShipRepairDeviceAdmin
    - id: FireExtinguisherBluespace
    - id: HolofanProjector
    - id: RPED

- type: entity
  parent: WGAdminKitPouchBase
  id: WGAdminKitPouchMedical
  components:
  - type: StorageFill
    contents:
    - id: AdminHypo
    - id: HandheldHealthAnalyzer
    - id: BluespaceBeaker
    - id: SyringeBluespace

- type: entity
  parent: WGAdminKitPouchBase
  id: WGAdminKitPouchAccess
  components:
  - type: StorageFill
    contents:
    - id: UniversalIDCard
    - id: AccessConfiguratorUniversal
    - id: DoorRemoteAll
    - id: EmagUnlimited
    - id: DemagUnlimited
    - id: AccessBreakerUnlimited
    - id: PinpointerUniversalDebug
    - id: ImplanterAdmeme

- type: entity
  parent: WGAdminKitPouchBase
  id: WGAdminKitPouchBuilding
  components:
  - type: StorageFill
    contents:
    - id: RCDExperimental
    - id: LightReplacer
    - id: HoloprojectorField

- type: entity
  parent: WGAdminKitPouchBase
  id: WGAdminKitPouchMovement
  components:
  - type: StorageFill
    contents:
    - id: HandTeleporterAdmin
    - id: WeaponTetherGunAdmin
    - id: WeaponForceGunAdmin

- type: entity
  parent: WGAdminKitPouchBase
  id: WGAdminKitPouchWeapons

- type: entity
  parent: WGAdminKitPouchBase
  id: WGAdminKitPouchFun

# The kit catalogue: what the Kit window offers, adminkit give hands out, and a layout keeps for an admin without
