  - type: Destructible
    thresholds: []

- type: entity
  id: WGRightHandProtean
  parent: [WGPartProtean, BaseRightHand]
  categories: [ HideSpawnMenu ]
  components:
  - type: Destructible
    thresholds: []

- type: entity
  id: WGLeftLegProtean
  parent: [WGPartProtean, BaseLeftLeg]
