# Its battery's charge is the Protean's nanomass.
- type: entity
  id: WGProteanSeed
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _WG/Xenobiology/Specific/Xenobiology/extract.rsi
    state: core
  - type: Item
    size: Tiny
  - type: Organ
    slotId: seed
  - type: Battery
    maxCharge: 100
    startingCharge: 100
    pricePerJoule: 0
  - type: WGProteanSeed
