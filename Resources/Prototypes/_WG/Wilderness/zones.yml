# Zones the rules give a protection status to. Grids and markers name them in a WGZoneSource.

- type: wgZone
  id: WGSafeZone
  kind: Safe
  priority: 30
  radius: 256
  color: "#2e9e4f"
  title: wg-zone-safe-title
  summary: wg-zone-safe-summary
  entered: wg-zone-safe-entered
  left: wg-zone-safe-left
  ringLabel: wg-zone-safe-ring
  alert: WGZoneSafe
  icon:
    sprite: _WG/Wilderness/zones.rsi
    state: safe
  enterSound:
    path: /Audio/Misc/notice2.ogg
  guide: MonolithRuleRoleplaySevenSafeZones

- type: wgZone
