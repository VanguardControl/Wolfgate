# The rim of a bounded world: the last tiles inside its circle, laid once the ground is preloaded. The chain boundary
# stands at the rim's inner edge, so nobody walks on it.

- type: tile
  id: WGPlanetRimRock
  name: tiles-wg-planet-rim
  sprite: /Textures/_WG/Planets/Tiles/rim_rock.png
  baseTurf: ""
  isSubfloor: true
  indestructible: true
  deconstructTools: []
  weather: true
  footstepSounds:
    collection: FootstepAsteroid
  heatCapacity: 10000

# The older rim, one wall a tile, for a surface that sets boundaryWall and clears boundaryTile.

- type: entity
  parent: WallConcreteIndestructible
  id: WGPlanetBoundaryWall
  name: world's edge
  description: Sheer rock, as far as anyone can see. There is nothing past it.
  suffix: planet boundary
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    layers:
    - state: rock
    - map: [ "enum.EdgeLayer.South" ]
      state: rock_south
    - map: [ "enum.EdgeLayer.East" ]
      state: rock_east
    - map: [ "enum.EdgeLayer.North" ]
      state: rock_north
    - map: [ "enum.EdgeLayer.West" ]
      state: rock_west
  - type: Icon
    sprite: Structures/Walls/rock.rsi
    state: rock
  - type: IconSmooth
    key: rockwalls
    mode: NoSprite
  - type: SmoothEdge
  - type: WGBiomeKeep
