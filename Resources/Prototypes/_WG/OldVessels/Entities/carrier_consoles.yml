# Carrier consoles of the restored Ledokol and M-Class, removed upstream by
# Monolith#4624. The old IDs are nulled in Resources/mono_migration.yml, so these carry a WG prefix and the restored
# grids use them.

- type: entity
  id: WGMiningCarrierComputer
  parent: BaseCarrierComputer
  name: mining carrier console
  components:
  - type: ShipyardListing
    shuttles:
    - Ample
    - Antlion

- type: entity
  id: WGLedokolAttachmentComputer
  parent: BaseCarrierComputer
  name: ledokol attachment console
  components:
  - type: ShipyardListing
    shuttles:
    - Molotok
    - Kopye
    - Kupol
