# Names and descriptions come from Fluent (ent-<id>).
- type: entity
  id: WGActionMentorCritterPocket
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    icon: { sprite: Mobs/Animals/mouse.rsi, state: mouse-0 }
    event: !type:WGMentorCritterPocketActionEvent

- type: entity
  id: WGActionMentorCritterHead
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    icon: { sprite: _WG/Mentors/mentor_mark.rsi, state: mentor }
    event: !type:WGMentorCritterHeadActionEvent

- type: entity
  id: WGActionMentorCritterDown
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    icon: Interface/Actions/disarm.png
    checkCanInteract: false
    event: !type:WGMentorCritterDownActionEvent

- type: entity
  id: WGActionMentorCritterAloud
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    icon: Interface/Actions/scream.png
    checkCanInteract: false
    event: !type:WGMentorCritterAloudActionEvent

- type: entity
  id: WGActionMentorCritterPing
  categories: [ HideSpawnMenu ]
  components:
  - type: WorldTargetAction
    checkCanAccess: false
    checkCanInteract: false
    range: 12
    useDelay: 2
    icon: { sprite: Interface/Misc/pointing.rsi, state: pointing }
    event: !type:WGMentorCritterPingActionEvent

# What the asker sees where a critter points; spawned on their client alone.
- type: entity
  id: WGMentorPingMarker
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: Interface/Misc/pointing.rsi
    state: pointing
    drawdepth: Overlays
    noRot: true
    color: "#FFB000"
