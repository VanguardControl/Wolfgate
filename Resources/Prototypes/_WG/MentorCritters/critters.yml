    sprite: Mobs/Animals/mothroach/mothroach.rsi
    layers:
    - state: mothroach
  - type: Item
    size: Normal
  - type: Clothing
    quickEquip: false
    sprite: Mobs/Animals/mothroach/mothroach.rsi
    equippedPrefix: 0
    slots:
    - HEAD

- type: entity
  parent: WGMentorCritterBase
  id: WGMentorCritterFrog
  components:
  - type: Sprite
    sprite: Mobs/Animals/frog.rsi
    layers:
