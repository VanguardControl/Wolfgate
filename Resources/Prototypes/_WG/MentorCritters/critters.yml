# Mentor critters (D16): a Mentor in the round beside the asker as a small animal. Names and descriptions are set when
# one spawns (wg-mentor-critter-name, wg-mentor-critter-desc). The base can't be hurt (no Damageable), eaten, butchered,
# pulled or picked up, isn't a ghost role, and speaks plainly (no language, no accent).
- type: entity
  abstract: true
  parent: BaseMob
  id: WGMentorCritterBase
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: WGMentorCritter
  - type: Sprite
    drawdepth: SmallMobs
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 50
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 5
  - type: Hands
  - type: ComplexInteraction
  - type: Pacified
    disallowAllCombat: true
  - type: Speech
    speechVerb: SmallMob
  - type: Grammar
    attributes:
      gender: epicene
  - type: Tag
    tags:
    - CannotSuicide

- type: entity
  parent: WGMentorCritterBase
  id: WGMentorCritterMouse
  components:
  - type: Sprite
    sprite: Mobs/Animals/mouse.rsi
    layers:
    - state: mouse-0
  - type: Item
    size: Tiny
    heldPrefix: 0
  - type: Clothing
    quickEquip: false
    sprite: Mobs/Animals/mouse.rsi
    equippedPrefix: 0
    slots:
    - HEAD

- type: entity
  parent: WGMentorCritterBase
  id: WGMentorCritterHamster
  components:
  - type: Sprite
    sprite: Mobs/Animals/hamster.rsi
    layers:
