# Wall-hung pride flags, beside the rainbow LGBTQFlag. The sprites are drawn by Tools/_WG/PrideFlags/pride_flags.py.
- type: entity
  abstract: true
  parent: BaseFlag
  id: WGPrideFlagBase
  components:
  - type: Sprite
    sprite: _WG/PrideFlags/flags.rsi

- type: entity
  parent: WGPrideFlagBase
  id: WGPrideFlagGay
  name: gay pride flag
  description: Green, blue and white, for men who love men.
  components:
  - type: Sprite
    state: gay

- type: entity
  parent: WGPrideFlagBase
  id: WGPrideFlagLesbian
  name: lesbian pride flag
  description: Sunset oranges and pinks, for women who love women.
  components:
  - type: Sprite
    state: lesbian

- type: entity
  parent: WGPrideFlagBase
  id: WGPrideFlagBisexual
  name: bisexual pride flag
  description: Pink, purple and blue.
  components:
  - type: Sprite
    state: bisexual

- type: entity
  parent: WGPrideFlagBase
  id: WGPrideFlagTransgender
  name: transgender pride flag
  description: Blue, pink and white. However you hang it, it's the right way up.
  components:
  - type: Sprite
    state: transgender

- type: entity
  parent: WGPrideFlagBase
  id: WGPrideFlagPansexual
  name: pansexual pride flag
  description: Pink, yellow and blue.
  components:
  - type: Sprite
    state: pansexual

- type: entity
  parent: WGPrideFlagBase
  id: WGPrideFlagAsexual
  name: asexual pride flag
  description: Black, grey, white and purple.
  components:
  - type: Sprite
    state: asexual

- type: entity
  parent: WGPrideFlagBase
  id: WGPrideFlagAromantic
  name: aromantic pride flag
  description: Greens, white, grey and black.
  components:
  - type: Sprite
    state: aromantic

- type: entity
  parent: WGPrideFlagBase
  id: WGPrideFlagNonbinary
  name: nonbinary pride flag
  description: Yellow, white, purple and black.
  components:
  - type: Sprite
    state: nonbinary

- type: entity
  parent: WGPrideFlagBase
  id: WGPrideFlagGenderfluid
  name: genderfluid pride flag
