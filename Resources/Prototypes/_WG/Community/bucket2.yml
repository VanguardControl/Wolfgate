# Vessel prototype made in mapping mode from "bucket". Check every field before it goes in the game.
# Grid: put bucket.yml at Resources/SharedMaps/_WG/Community/bucket2.yml
# Prototype: put this file, bucket.vessel.yml, at Resources/Prototypes/_WG/Community/bucket2.yml
# Guessed from the grid (62 tiles), not set by the mapper: description, price, category, class, engine. Check them.
# Set by the mapper in the export wizard: name, group, access, requireCrew.

- type: vessel
  id: WGBucket2
  parent: BaseVessel
  name: 'Bucket Mk.2'
  description: 'A small janitorial ship w%$*-- for the HEAD OF SANITATION. PROPERTY OF JERSEY ASHWORTH DO NOT STEAL'
  price: 150 # appraised at 11740
  category: Small # 62 tiles
  group: Sr
  access: Janitor
  shuttlePath: /SharedMaps/_WG/Community/bucket2.yml
  guidebookPage: null
  class:
  - Civilian
  engine:
  - Plasma

- type: gameMap
  id: WGBucket2
  mapName: 'Bucket'
  mapPath: /SharedMaps/_WG/Community/bucket2.yml
  minPlayers: 0
  stations:
    WGBucket2:
      stationProto: StandardFrontierVessel
      components:
      - type: StationNameSetup
        mapNameTemplate: 'Bucket HOS{1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: '14'
      - type: StationJobs
        availableJobs: {}
