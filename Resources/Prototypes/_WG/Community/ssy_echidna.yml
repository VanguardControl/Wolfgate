# Vessel prototype made in mapping mode from "Echidna". Check every field before it goes in the game.
# Grid: put Echidna.yml at Resources/SharedMaps/_WG/Community/ssy_echidna.yml
# Prototype: put this file, Echidna.vessel.yml, at Resources/Prototypes/_WG/Community/ssy_echidna.yml
# Guessed from the grid (750 tiles), not set by the mapper: description, category, engine. Check them.
# Set by the mapper in the export wizard: name, price, class, group, access, requireCrew.

- type: vessel
  id: WGSSYEchidna
  parent: BaseVessel
  name: 'SSY-Echidna'
  description: 'Describe the ship here.'
  price: 290000 # appraised at 133217
  category: Large # 750 tiles
  group: Shipyard
  shuttlePath: /SharedMaps/_WG/Community/ssy_echidna.yml
  guidebookPage: null
  class:
  - Capital
  - Expedition
  - Science
  - Mercenary
  - Carrier
  - MechCarrier
  engine:
  - AME

- type: gameMap
  id: WGSSYEchidna
  mapName: 'SSY-Echidna'
  mapPath: /SharedMaps/_WG/Community/ssy_echidna.yml
  minPlayers: 0
  stations:
    WGSSYEchidna:
      stationProto: StandardFrontierVessel
      components:
      - type: StationNameSetup
        mapNameTemplate: 'SSY-Echidna {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: '14'
      - type: StationJobs
        availableJobs:
          Contractor: [ 0, 0 ]
