name: PR Title Case
on:
  pull_request_target:
    types: [opened, edited, synchronize]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # WOLFGATE: built-in token instead of bot PAT
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  prtitlecase:
    runs-on: ubuntu-latest
    # WOLFGATE START: needed since the built-in token replaces the bot PAT
    permissions:
      pull-requests: write
    # WOLFGATE END
    steps:
      - name: Checkout Master
        uses: actions/checkout@v3
        # WOLFGATE START: GITHUB_TOKEN is used instead, no PAT needed
        # with:
        #   token: ${{ secrets.BOT_TOKEN }}
        # WOLFGATE END

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install Dependencies
        run: |
          cd "Tools/prtitlecase"
          npm install
        shell: bash

      - name: Change Title
        run: |
          cd "Tools/prtitlecase"
          node index.js
        shell: bash
