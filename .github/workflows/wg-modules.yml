# WOLFGATE(Ci): checks the module docs and non-modular edits with Tools/_WG/Ci/modules.py (see AGENTS.md)
name: Wolfgate Modules

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modules:
    name: Wolfgate Modules
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2
      with:
        fetch-depth: 0

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install pyyaml pillow # WOLFGATE(ClothingLayer): shapes.py reads the clothing sprites

    - name: Check module docs and markers
      run: python3 Tools/_WG/Ci/modules.py --check

    # WOLFGATE(ClothingLayer): fails when a clothing sprite was added or changed without regenerating the shapes list
    - name: Check clothing shapes
      if: ${{ !cancelled() }}
      run: python3 Tools/_WG/ClothingLayer/shapes.py --check

    # Runs even when the check above failed; skipped for Monolith ports, whose upstream edits carry no markers.
    - name: Check edits outside _WG
      # WOLFGATE(Downstreams): a downstream (MODULES_LAYER_CONFIG set) checks its own layer below instead
      if: ${{ !cancelled() && vars.MODULES_LAYER_CONFIG == '' && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'autoport/') && !startsWith(github.event.pull_request.title, '[AUTOPORT]') }}
      env:
        BASE_REF: ${{ github.base_ref }}
      run: python3 Tools/_WG/Ci/modules.py --pr-check "origin/$BASE_REF"

    # WOLFGATE(Downstreams) START: a downstream's own layer, from the repository variable MODULES_LAYER_CONFIG
    # Set only in a downstream repository (KnotGate: Tools/_KG/Ci/modules.yml); Wolfgate itself skips both steps.
    # Wolfgate merges into the downstream (branch upstream/*, or a title starting [UPSTREAM]) are upstream code.
    - name: Check downstream module docs and markers
      if: ${{ !cancelled() && vars.MODULES_LAYER_CONFIG != '' }}
      run: python3 Tools/_WG/Ci/modules.py --config "${{ vars.MODULES_LAYER_CONFIG }}" --check

    - name: Check downstream edits outside its layer
      if: ${{ !cancelled() && vars.MODULES_LAYER_CONFIG != '' && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'upstream/') && !startsWith(github.event.pull_request.title, '[UPSTREAM]') }}
      env:
        BASE_REF: ${{ github.base_ref }}
      run: python3 Tools/_WG/Ci/modules.py --config "${{ vars.MODULES_LAYER_CONFIG }}" --pr-check "origin/$BASE_REF"
    # WOLFGATE END
