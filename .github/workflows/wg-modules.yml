# WOLFGATE(Ci): checks the module docs and non-modular edits with Tools/_WG/Ci/modules.py (see AGENTS.md)
name: Wolfgate Modules

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modules:
    name: Wolfgate Modules
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2
      with:
        fetch-depth: 0

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install pyyaml pillow # WOLFGATE(ClothingLayer): shapes.py reads the clothing sprites

    - name: Check module docs and markers
      run: python3 Tools/_WG/Ci/modules.py --check

    # WOLFGATE(ClothingLayer): fails when a clothing sprite was added or changed without regenerating the shapes list
    - name: Check clothing shapes
      if: ${{ !cancelled() }}
      run: python3 Tools/_WG/ClothingLayer/shapes.py --check

    # WOLFGATE(Engine): fails while the engine gitlink is not a commit on the Lupine branch .gitmodules names
    - name: Check the engine gitlink is on its Lupine branch
      if: ${{ !cancelled() }}
      run: |
        branch=$(git config -f .gitmodules submodule.RobustToolbox.branch)
        url=$(git config -f .gitmodules submodule.RobustToolbox.url)
        sha=$(git ls-tree HEAD RobustToolbox | awk '{print $3}')
        git init -q "$RUNNER_TEMP/lupine"
        if ! git -C "$RUNNER_TEMP/lupine" fetch -q --filter=tree:0 "$url" "+refs/heads/$branch:refs/remotes/lupine/$branch"; then
          echo "::error::Lupine has no branch $branch (named in .gitmodules)."
          exit 1
        fi
        if git -C "$RUNNER_TEMP/lupine" merge-base --is-ancestor "$sha" "lupine/$branch"; then
          echo "RobustToolbox $sha is on $branch."
        else
          echo "::error::RobustToolbox points at $sha, which is not on Lupine's $branch. Merge the engine change into $branch first, or point the gitlink at a commit on it."
          exit 1
        fi

    # Runs even when the check above failed; skipped for Monolith ports, whose upstream edits carry no markers.
    - name: Check edits outside _WG
      if: ${{ !cancelled() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'autoport/') && !startsWith(github.event.pull_request.title, '[AUTOPORT]') }}
      env:
        BASE_REF: ${{ github.base_ref }}
      run: python3 Tools/_WG/Ci/modules.py --pr-check "origin/$BASE_REF"
