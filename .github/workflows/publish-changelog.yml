# WOLFGATE(Ci) START: re-enabled, posts Wolfgate and upstream Monolith changelogs
name: Publish Changelog

# Posts new changelog entries to Discord, both our own (Wolfgate.yml) and upstream Monolith's
# (Monolith.yml). Runs daily and on demand. The script compares against the previous successful run of
# this workflow, so a failed run is retried in full next time rather than losing entries.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

concurrency:
  group: publish-changelog

permissions:
  contents: read
  actions: read

jobs:
  publish_changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install dependencies
        run: sudo apt-get install -y python3-requests python3-yaml

      - name: Publish changelog (Discord)
        run: python3 Tools/actions_changelogs_since_last_run.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Our changes.
          DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}
          # Upstream Monolith changes. Same channel unless CHANGELOG_DISCORD_WEBHOOK_UPSTREAM is set. Remove this
          # line to not post upstream changes at all.
          DISCORD_WEBHOOK_URL_UPSTREAM: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK_UPSTREAM || secrets.CHANGELOG_DISCORD_WEBHOOK }}
# WOLFGATE END
