name: Publish

# Publishing is something you ask for, never something a push does. A build lands on the Robust.Cdn, which
# tells the watchdog, and the server restarts onto it at the end of the current round - so a push to main
# used to replace a test merged build with a plain one while nobody was looking. Run it from the Actions tab,
# or from the SSymphony panel, which is what its Test merges page does.
on:
  workflow_dispatch:
    inputs:
      test_merges:
        description: 'Pull requests to merge on top of the branch before building, comma-separated numbers. Empty builds the branch as it is.'
        required: false
        default: ''
      request_id:
        description: 'Set by the SSymphony panel so it can find this run again. Leave empty when running by hand.'
        required: false
        default: ''
      fork_id:
        description: 'CDN fork id to publish under. Empty is the fork itself; a test server tracks an id of its own, such as wolfgate-test.'
        required: false
        default: ''

# The panel finds its run by this name; a plain push keeps the workflow's own.
run-name: ${{ inputs.request_id != '' && format('Publish {0}{1}', inputs.test_merges != '' && 'test merge ' || '', inputs.request_id) || 'Publish' }}

# One publish at a time and never cancelled part-way: a killed run could leave a half-registered version.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # to resolve the build artifact's download URL for the CDN, and delete it afterwards
  pull-requests: read   # to name the pull requests being test merged

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.2.2
      with:
        submodules: 'recursive'
        # A test merge needs the history a merge base lives in; a plain build does not.
        fetch-depth: ${{ inputs.test_merges == '' && 1 || 0 }}

    # Merges the requested pull requests with a merge commit each, skipping any that conflict, and stamps the
    # build with what merged (Resources/Symphony/testmerges.json, read by the Symphony hook). The merged
    # numbers also go into the version, so the CDN and the panel can name the set.
    - name: Test merge pull requests
      id: testmerge
      if: ${{ inputs.test_merges != '' }}
      run: python3 Tools/test_merge.py "${{ inputs.test_merges }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore

    - name: Build packaging tool
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    # Only the platform the server actually runs on. Add e.g. `--platform linux-x64` if a Linux host ever joins.
    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    # The CDN pulls the build from here (Robust.Cdn "one-shot" publish), so the 360 MB client never has to be
    # uploaded through Cloudflare's 100 MB request limit. Stored uncompressed: the zips are already compressed.
    - name: Upload build artifact
      id: artifact
      uses: actions/upload-artifact@v4
      with:
        name: wolfgate-build-${{ github.run_number }}
        path: release/
        if-no-files-found: error
        compression-level: 0
        retention-days: 1

    - name: Publish to Robust.Cdn
      run: python3 Tools/publish_github_artifact.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        VERSION_SUFFIX: ${{ steps.testmerge.outputs.suffix }}${{ inputs.request_id != '' && format('-{0}', inputs.request_id) || '' }}
        FORK_ID: ${{ inputs.fork_id }}

    # The artifact is only a hand-off to the CDN. Every one left behind counts against the org's 500 MB
    # Actions storage, and once that is full every upload fails with a 403.
    - name: Delete build artifact
      run: gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${{ steps.artifact.outputs.artifact-id }}"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # A test merge or test fork build is not a release of main, so its changelog entries are not announced.
    - name: Publish changelog (Discord)
      if: ${{ inputs.test_merges == '' && inputs.fork_id == '' }}
      continue-on-error: true
      run: Tools/actions_changelogs_since_last_run.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}
