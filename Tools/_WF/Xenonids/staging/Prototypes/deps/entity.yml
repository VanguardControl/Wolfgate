# RMC-14: Resources/Prototypes/_RMC14/Actions/cm_mob_state_actions.yml
- type: entity
  id: CMActionGhost
  name: Ghost
  description: Become a Ghost.
  components:
  - type: Action
    itemIconStyle: NoItem
    checkCanInteract: false
    checkConsciousness: false
    icon:
      sprite: Mobs/Ghosts/ghost_human.rsi
      state: icon
  - type: InstantAction
    event: !type:CMGhostActionEvent

# RMC-14: Resources/Prototypes/_RMC14/Entities/Structures/Base/base_structure.yml
- type: entity
  parent:
  - BaseWall
  - CMBaseXenoStructure
  id: CMBaseWallXeno
  name: resin wall
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Damageable
    damageContainer: StructuralXeno
    damageModifierSet: Resin
  - type: Appearance
  - type: RadiationBlocker
    resistance: 5
  - type: PlacementReplacement
    key: walls
  - type: ExplosionResistance
    damageCoefficient: 3.64
  - type: DamageMultiplierFlags
    flags:
    - Turf
    - Xeno
  - type: ResinSurgeReinforcable
  - type: Tag
    tags:
    - SpreaderIgnore
    - Wall
  - type: XenoToggleChargingDamage
    stop: true
    damage:
      types:
        Blunt: 5
  - type: XenoRecentlyBuiltPreventCollisions

# RMC-14: Resources/Prototypes/_RMC14/Entities/Structures/Base/base_structure.yml
- type: entity
  parent: BaseStructure
  id: CMBaseXenoStructure
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Corrodible
    isCorrodible: false
  - type: CMIconSmooth
  - type: MeleeReceivedMultiplier
    otherMultiplier: 8.2
  - type: XenoConstructionSupport
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: XenoResinBreak
  - type: XenoConstruct
  - type: RMCDeleteAnchoredOnInit
    whitelist:
      tags:
      - XenoWeedNode
  - type: RMCWallExplosionDeletable
  - type: DestroyedByExplosionType
  - type: NpcFactionMember
    factions:
    - RMCXeno
  - type: RMCNightVisionVisible
    priority: -1
    transparency: 0.2
  - type: InvulnerabilityTime
    whitelist:
      components:
      - Marine
    hitsToInvulnerability: 3
  - type: DamageMultiplierFlags
    flags: Breaching
  - type: DeletedByWeedKiller
  - type: Flammable
    fireSpread: false
    maximumFireStacks: 0.5
    damage:
      types:
        Heat: 4.8

