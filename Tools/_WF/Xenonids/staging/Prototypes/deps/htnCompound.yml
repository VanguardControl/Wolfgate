# RMC-14: Resources/Prototypes/_RMC14/NPC/parasite.yml
- type: htnCompound
  id: RMCParasiteActiveCompound
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: RMCParasiteInfect
  - tasks:
    - !type:HTNCompoundTask
      task: RMCParasiteLeap

# RMC-14: Resources/Prototypes/_RMC14/NPC/parasite.yml
- type: htnCompound
  id: RMCParasiteInfect
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: RMCNearbyDownInfectable
        key: TargetDown

    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: TargetDown
      - !type:TargetInRangePrecondition
        targetKey: TargetDown
        rangeKey: InteractRange
      operator: !type:InteractWithOperator
        targetKey: TargetDown
        expectDoAfter: true

    - !type:HTNPrimitiveTask
      operator: !type:SetFloatOperator
        targetKey: IdleTime
        amount: 5

    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: IdleTime
      operator: !type:WaitOperator
        key: IdleTime
      services:
      - !type:UtilityService
        id: InfectService
        proto: RMCNearbyDownInfectable
        key: TargetDown

# RMC-14: Resources/Prototypes/_RMC14/NPC/parasite.yml
- type: htnCompound
  id: RMCParasiteLeap
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: RMCNearbyLeapInfectable

    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: VisionRadius
      operator: !type:LeapOperator
        targetKey: Target

    - !type:HTNPrimitiveTask
      operator: !type:SetFloatOperator
        targetKey: IdleTime
        amount: 5

    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: IdleTime
      operator: !type:WaitOperator
        key: IdleTime

      services:
      - !type:UtilityService
        id: LeapService
        proto: RMCNearbyLeapInfectable
        key: Target

