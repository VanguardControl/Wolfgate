- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoRest
  name: Rest
  description: Lie down to regenerate health more quickly while on weeds. [color=red]Your rest keybind will also activate this action, Shift+R by default.[/color]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: resting

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoWatch
  name: Watch Xenonid
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      state: watch_xeno

- type: entity
  id: ActionXenoHide
  parent: ActionXenoBase
  name: Hide
  description: Hide under tables and other objects.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: xenohide
    useDelay: 0.5
  - type: InstantAction
    event: !type:XenoHideActionEvent

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoHide
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: xenohide

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoResinWalker
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      state: toggle_speed

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoToggleLongRangeSight
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      state: toggle_long_range

- type: entity
  id: ActionXenoWordQueen
  parent: ActionXenoBase
  name: Word of the Queen (50) # TODO RMC14 proper plasma costs
  description: Sends a message to all members of your hive.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: queen_word
    useDelay: 10
  - type: InstantAction
    event: !type:XenoWordQueenActionEvent
  - type: XenoWordQueenAction
  - type: RMCDazeableAction

- type: entity
  id: ActionXenoPsychicWhisper
  parent: ActionXenoBase
  name: Psychic Whisper
  description: Whisper a psychic message to a nearby mind.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: psychic_whisper
    useDelay: 10
  - type: TargetAction
    range: 7
  - type: EntityTargetAction
    event: !type:XenoPsychicWhisperActionEvent
    canTargetSelf: false
    toggleOutline: false
    whitelist:
      components:
      - MobState
  - type: RMCDazeableAction

- type: entity
  id: ActionXenoPsychicRadiance
  parent: ActionXenoBase
  name: Psychic Radiance (100)
  description: Radiate a psychic message to nearby minds.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: psychic_radiance
    useDelay: 10
  - type: InstantAction
    event: !type:XenoPsychicRadianceActionEvent
  - type: RMCDazeableAction

- type: entity
  id: ActionXenoGiveOrder
  parent: ActionXenoBase
  name: Give Order (100)
  description: Send a psychic order to the xenonid you are watching.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: queen_order
    useDelay: 10
  - type: InstantAction
    event: !type:XenoGiveOrderActionEvent
  - type: RMCDazeableAction

- type: entity
  id: ActionXenoTurnInvisible
  parent: ActionXenoBase
  name: Turn Invisible (20) # TODO RMC14 proper plasma costs
  description: Become partially invisible for 30 seconds, or until you either damage or attempt to devour an enemy. Can be toggled off to become visible again, with a refund of 90% remaining cloak time. Increases your movement speed by 15% until the ability expires.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: lurker_invisibility
  - type: InstantAction
    event: !type:XenoTurnInvisibleActionEvent

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoTurnInvisible
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      state: lurker_invisibility

- type: entity
  parent: ActionXenoBase
  id: ActionXenoManageHive
  name: Manage The Hive
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: xeno_readmit
    useDelay: 0.5
  - type: InstantAction
    event: !type:ManageHiveActionEvent

- type: entity
  parent: ActionXenoBase
  id: ActionXenoEmpower
  name: Empower (50)
  description: On first activation it, gain a small amount of shield. After 6 seconds or using it again, get empowered based on surrounding enemies (max 6), gaining shield from each. If you empowered from at least 3 targets, you become Super-Empowered, gaing additional damage on melee attacks, and changing how some of your other abilities work.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: rav_empower
  - type: InstantAction
    event: !type:XenoEmpowerActionEvent
  - type: ActionBlockIfResting

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoEmpower
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      state: rav_empower
