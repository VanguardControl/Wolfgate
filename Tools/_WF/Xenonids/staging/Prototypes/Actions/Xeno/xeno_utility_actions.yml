- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoTransferPlasma
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      state: transfer_plasma

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoLeader
  name: Choose Leaders
  description: Promotes and demotes xenonid leaders, or watches them. Promoting a xeno to leader will make them emit your pheromones around themselves.
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      state: xeno_lead

- type: entity
  parent: ActionXenoBase
  id: ActionXenoTantrum
  name: Tantrum (100 plasma, 75 fury)
  description: Give an ally and yourself temporary armor for a few seconds, which lasts longer on you. Crushers and Ravagers get a speed boost instead.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: warden_heal
    useDelay: 7
  - type: TargetAction
    checkCanAccess: false
    range: 8
  - type: EntityTargetAction
    event: !type:XenoTantrumActionEvent

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoTantrum
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      state: warden_heal

- type: entity
  parent: ActionXenoBase
  id: ActionXenoSpikeShield
  name: Spike Shield (150 shards)
  description: Expend shards to gain a temporary shield that lasts for a short amount of time. Whenever the shield is damaged, spray bone shards around you in a 5x5 AoE centered on yourself. Shield lasts for 2 seconds.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: rav_shard_shield
    useDelay: 11.5
  - type: InstantAction
    event: !type:ActionXenoSpikeShieldEvent
  - type: ActionBlockIfResting
  - type: RMCDazeableAction

